const TXT={
 '1a':{i:`Chaque question commence par 4 accords : la <b>cadence</b>. Elle installe la tonalité et finit sur la <b>maison</b>. Ensuite, une note sonne.<br><br><b>Méthode :</b> (1) chante dans ta tête la dernière note de la cadence : c'est le 1. (2) Écoute la note mystère. (3) Compare : sonne-t-elle comme la maison, posée, finie ? C'est le 1. Sonne-t-elle plus haute et plus ouverte, mais tu pourrais t'y arrêter ? C'est le 5.<br><br>La tonalité change à chaque question : tu ne peux pas retenir un son, seulement la place de la note par rapport à la maison.`,t:`Si tu hésites, chante la gamme depuis la maison : 1 – 2 – 3 – 4 – 5. Le 5 est la 5e note, tout en haut de l'accord de la maison.`},
 '1b':{i:`1, 3 et 5 sont les trois notes de l'accord de la maison : ce sont les notes <b>stables</b>, celles sur lesquelles on peut s'arrêter.<br><br><b>Méthode :</b> d'abord, la note est-elle posée ? Oui : c'est 1, 3 ou 5. Pour trancher : le 1 est la maison (aucune envie de bouger), le 3 est lumineux, un peu « joyeux », le 5 est plus haut et plus ouvert.`,t:`Chante 1 – 2 – 3 – 4 – 5 depuis la maison : le 3 est la 3e note de la gamme, le 5 la 5e. Place la note mystère sur cette échelle.`},
 '1c':{i:`Le 2 est la première note <b>instable</b> : il n'est pas dans l'accord de la maison.<br><br><b>Méthode :</b> si la note sonne en suspens (tu ne peux pas t'arrêter dessus), c'est une note instable. Ici, la seule candidate est le 2 : il est juste au-dessus de la maison, à un pas. Redescends d'un pas et tu y es.`,t:`Test de l'arrêt : arrête-toi sur la note. Si ça sonne coupé et que tu veux redescendre d'un pas, c'est le 2.`},
 '2a':{t:`Méthode : écoute la note du milieu de l'accord. Majeur : claire et ouverte. Mineur : plus sombre, plus triste. Dans la correction, compare avec l'autre version.`},
 '2b':{t:`Méthode : à la fin de l'accord, est-ce que tu te sens arrivé (I) ou en attente (V) ? La cadence t'a donné la maison : compare l'accord à elle.`},
 '2c':{t:`Méthode en 2 temps : (1) posé ? C'est le I. (2) Sinon, le IV s'ouvre et s'éloigne en douceur, le V reste en attente et appelle le I.`},
 '2d':{i:`On ajoute le <b>vi</b>, le seul mineur des quatre. I, IV, V et vi : les quatre accords de la plupart des chansons pop.`,t:`Méthode : (1) triste ? C'est le vi. (2) Sinon, posé ? C'est le I. (3) Ouvert et doux ? Le IV. (4) En attente ? Le V.`},
 '3a':{t:`Méthode : le premier accord est le I. Compare le second à lui : triste (vi), ouvert et doux (IV) ou en attente (V) ?`},
 '3b':{t:`Méthode : regarde le début et la fin. Début triste : « Zombie ». Fin posée sur la maison : I – IV – V – I. Fin ouverte (IV) : la grille pop. Fin en attente (V) avec un début posé : la grille des années 50.`},
 '3c':{t:`Méthode : un accord à la fois. Le premier est le I. Pour chacun des suivants : triste → vi, ouvert → IV, en attente → V.`},
 '3d':{t:`Méthode : repère le premier accord (posé = I, triste = vi) puis le dernier. Remplis ensuite le milieu, un accord à la fois, en réécoutant.`},
 'r3':{t:`Méthode : tape du pied à chaque temps (1, 2, 3, 4). Un coup qui tombe sur ton pied est sur un temps ; un coup entre deux battements est sur un « et ».`},
 'r6':{t:`Méthode : pendant les 4 clics, prends le tempo avec ton pied. Puis note où tombent les coups par rapport à lui.`},
 '4a':{t:`Méthode : (1) retrouve la maison grâce à la cadence ; (2) la mélodie monte ou descend ? (3) de combien de pas ? Chante-la depuis la maison pour vérifier.`},
 '4b':{t:`Méthode : sur un saut, la note d'arrivée est souvent stable (1, 3, 5) : essaie d'abord ces trois-là, puis les autres.`},
 '4c':{t:`Méthode : coupe en deux : les 2 premières notes, puis les 2 dernières. Pour chacune, direction et nombre de pas par rapport à la précédente.`},
 '4d':{t:`Méthode : trouve la 1re et la dernière note (la dernière est souvent stable : 1, 3 ou 5). Remplis ensuite le milieu en réécoutant.`},
 'p2':{t:`Méthode : le ♭VII est majeur et lumineux, avec une basse à un ton sous la maison. Compare-le au V : le V attend et appelle le I, le ♭VII s'ouvre, un peu rock.`},
 'p3':{t:`Méthode : repère où tombe l'accord « rock » : le ♭VII, souvent juste après la maison, comme un pas de côté.`},
 'm3':{t:`Méthode : d'abord majeur ou mineur ? (i et iv sont mineurs ; III, VI et VII sont majeurs.) Ensuite, compare la basse à la maison.`},
 'm4':{t:`Méthode : repère les accords mineurs (i, iv) et les majeurs (III, VI, VII), puis place-les dans l'ordre.`},
 'm5':{t:`Méthode : retrouve la maison (mineure), puis direction et pas. Si tu hésites, compare le 3, le 6 et le 7 à la gamme majeure : ils sont un demi-ton plus bas.`},
 '6a':{i:`Deux nouveaux accords mineurs : le <b>ii</b> (qui prépare le V) et le <b>iii</b>, plus rare.`,t:`Méthode : triste ? Alors vi, ii ou iii. Compare la basse à la maison : est-elle au 2e, au 3e ou au 6e pas de la gamme ?`},
 '6b':{t:`Méthode : ii → V → I est un enchaînement très courant, il sonne comme une arrivée. Cherche-le à la fin de la grille.`},
 '6c':{t:`Méthode : découpe en deux morceaux de trois notes. Pour chaque note : direction et nombre de pas depuis la précédente.`},
 '6d':{t:`Pour chaque question, identifie d'abord le type (une note, un accord, une grille, une mélodie), puis applique la méthode correspondante.`}};

function unlocked(i){if(S.free||i===0)return true;const tr=U[LESSONS[i].unit].track;let j=i-1;while(j>=0&&U[LESSONS[j].unit].track!==tr)j--;if(j<0)return tr==='acc'?passed('2d'):true;const p=LESSONS[j];return passed(p.id)||((p.type==='kb'||p.opt)&&unlocked(j))}
function unitDone(ui){return U[ui].L.filter(l=>l.type!=='kb'&&!l.opt).every(l=>passed(l.id))}
function checkUnits(){U.forEach((u,ui)=>{if(unitDone(ui))award('u_'+u.id)})}
const EUI=()=>U.map((u,i)=>i).filter(i=>U[i].track==='ear');
function rankIdx(){let n=0;const e=EUI();for(let i=0;i<e.length;i++){if(unitDone(e[i]))n=i+1;else break}return n}
function level(){let x=S.xp,l=1,need=100;while(x>=need){x-=need;l++;need=100+(l-1)*60}return{l,cur:x,need}}

function fmt(n){const acc=n.slice(1).replace('#','♯').replace('b','♭');return (S.notation==='fr'?FR[n[0]]:n[0])+acc}
const keyName=k=>fmt(k.notes[0])+(k.m?' mineur':' majeur');
const noteName=(k,d)=>d===8?fmt(B7[k.id]||k.notes[6]):d===9?fmt(k.notes[4]):fmt(k.notes[(d-1)%7]);
function chordName(k,d){if(d===8)return fmt(B7[k.id]);if(d===9)return fmt(k.notes[4])+'7';const q=QL(k)[d-1];return fmt(k.notes[d-1])+(q==='m'?'m':q==='d'?'dim':'')}

/* ===================== AUDIO ===================== */
let AC,master,bus;
function audio(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=.55;master.connect(comp);comp.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function newBus(){audio();if(bus){const b=bus;try{b.gain.setTargetAtTime(0,AC.currentTime,.03)}catch(e){}setTimeout(()=>{try{b.disconnect()}catch(e){}},400)}bus=AC.createGain();bus.connect(master);return AC.currentTime+.08}
function tone(m,t,dur=1.2,vel=.6){const f=mtof(m);const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.008);g.gain.exponentialRampToValueAtTime(vel*.35,t+.3);g.gain.exponentialRampToValueAtTime(.0008,t+dur);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(9000,f*9),t);lp.frequency.exponentialRampToValueAtTime(Math.max(f*1.6,320),t+dur);lp.connect(g);g.connect(bus);[[1,1],[2,.42],[3,.2],[4,.1],[5,.05]].forEach(([h,a],i)=>{const o=AC.createOscillator();o.type=i===0?'triangle':'sine';o.frequency.value=f*h*(1+.0008*i);const og=AC.createGain();og.gain.value=a*.26;o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur+.05)})}
function tonic(k){let m=60+k.semi;if(m>66)m-=12;return m}
function degMidi(k,d,o=0){return tonic(k)+SC(k)[(d-1)%7]+12*(Math.floor((d-1)/7)+o)}
function chordMidis(k,d){const sc=SC(k),t0=tonic(k);let tri,r;
 if(d>7){const rs=d===8?10:7,iv=d===9?[0,4,7,10]:[0,4,7];tri=iv.map(x=>t0+rs+x);r=t0+rs}
 else{tri=[0,2,4].map(i=>{const dd=d-1+i;return t0+sc[dd%7]+12*Math.floor(dd/7)});r=t0+sc[d-1]}
 while(Math.min(...tri)>62)tri=tri.map(x=>x-12);while(Math.min(...tri)<53)tri=tri.map(x=>x+12);while(r>47)r-=12;while(r<36)r+=12;return{bass:r,tri}}
function playChord(c,t,dur=.8,vel=.5){tone(c.bass,t,dur+.5,vel*.85);c.tri.forEach(m=>tone(m,t,dur+.5,vel*.5))}
function cadence(k,t){(k.m?[1,4,10,1]:[1,4,5,1]).forEach((d,i)=>playChord(chordMidis(k,d),t+i*.55,.5,.45));return t+4*.55+.4}
let playTimer;
function markPlaying(sec){const q=document.querySelector('.quizwrap');if(!q)return;q.classList.add('playing');clearTimeout(playTimer);playTimer=setTimeout(()=>q.classList.remove('playing'),sec*1000)}
function playQ(q,withCad=true){if(q.type==='rhy'){markPlaying(playPat(q.pat,q.chord));return}CK=q.key;let t=newBus(),t0=t;const k=q.key;
 if(q.type==='qual'){playChord(q.chord,t,1.4,.55);t+=1.6}
 else if(q.type==='progid'){q.seq.forEach((d,i)=>playChord(chordMidis(k,d),t+i*1,.9,.5));t+=q.seq.length}
 else{ if(withCad)t=cadence(k,t);
  if(q.type==='deg'){tone(degMidi(k,q.ans,q.oct),t,1.8,.7);t+=1.2}
  else if(q.type==='mel'){q.ans.forEach((d,i)=>tone(degMidi(k,d),t+i*.6,.9,.65));t+=q.ans.length*.6}
  else if(q.type==='chord'){playChord(chordMidis(k,q.ans),t,1.4,.55);t+=1.4}
  else if(q.type==='prog'){q.ans.forEach((d,i)=>playChord(chordMidis(k,d),t+i*1,.9,.5));t+=q.ans.length}}
 markPlaying(t-t0)}
function playDeg(k,d,o=0,res=false,withCad=false){let t=newBus();if(withCad)t=cadence(k,t);tone(degMidi(k,d,o),t,1.2,.7);if(res){const path=RES[d];path.slice(1).forEach((x,i)=>tone(degMidi(k,x,o),t+.55+i*.38,i===path.length-2?1.4:.6,.6))}}
function playChordSolo(k,d,withCad=false){let t=newBus();if(withCad)t=cadence(k,t);playChord(chordMidis(k,d),t,1.4,.55)}
function playSeq(k,seq,kind){let t=newBus();t=cadence(k,t);seq.forEach((d,i)=>kind==='mel'?tone(degMidi(k,d),t+i*.6,.9,.65):playChord(chordMidis(k,d),t+i,.9,.5))}

/* ===================== GÉNÉRATION ===================== */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const BAGS={};
function pickAns(set,st){const key=set.join(',')+(st===S.stats.chd?'c':'d');let bag=BAGS[key];
 if(!bag||!bag.length){bag=[];set.forEach(x=>{const r=(st||{})[x];const err=r&&r.t>=3?1-r.c/r.t:0;const n=1+(err>=.5?2:err>=.3?1:0);for(let i=0;i<n;i++)bag.push(x)});
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
  if(set.length>1&&bag[bag.length-1]===lastAns){const k=bag.findIndex(x=>x!==lastAns);if(k>=0)[bag[bag.length-1],bag[k]]=[bag[k],bag[bag.length-1]]}
  BAGS[key]=bag}
 const a=bag.pop();lastAns=a;return a}
let lastAns=null;
function keyFor(l){const K=l.minor?MKEYS:KEYS;if(l.keys==='notC')return pick(K.slice(1));if(l.keys==='all')return pick(K);return K[0]}
function gen(l){
 if(l.type==='mix'){const pool=LESSONS.filter(x=>EAR(x)&&x.unit>=2&&x.type!=='rhy'&&!x.minor&&!(x.set||[]).some(d=>d>7));const src=pick(pool);const mq=gen({...src,keys:'all',id:l.id,t:l.t,src:src.t});mq.lid=src.id;return mq}
 const k=keyFor(l);const q={type:l.type,key:k,lesson:l,lid:l.id};
 if(l.type==='deg'){q.ans=pickAns(l.set,S.stats.deg);q.oct=l.wide?pick([-1,0,0]):0;q.opts=l.set}
 else if(l.type==='chord'){q.ans=pickAns(l.set,S.stats.chd);q.opts=l.set}
 else if(l.type==='qual'){q.min=Math.random()<.5;const r=52+Math.floor(Math.random()*10);q.chord={bass:r-12,tri:[r,r+(q.min?3:4),r+7]};q.ans=q.min}
 else if(l.type==='mel'){q.ans=genMel(l.set,l.len,l.step);q.opts=l.set}
 else if(l.type==='prog'){q.opts=l.set;if(l.len===4){let ok=(l.minor?PROG4M:PROG4).filter(p=>p.every(d=>l.set.includes(d)));const mx=Math.max(...l.set);if(mx>7){const w=ok.filter(p=>p.includes(mx));if(w.length)ok=w}q.ans=pick(ok).slice()}else{const s=[1];while(s.length<l.len){s.push(pick(l.set.filter(d=>d!==s[s.length-1])))}q.ans=s}}
 else if(l.type==='rhy'){genRhy(l,q)}
 else if(l.type==='progid'){q.idx=Math.floor(Math.random()*FAMOUS.length);q.seq=FAMOUS[q.idx].p;q.ans=q.idx}
 return q}
function genMel(set,len,step){const st=[1,3,5].filter(x=>set.includes(x));let cur=pick(st);const s=[cur];while(s.length<len){let o=set.filter(x=>x!==cur&&(!step||Math.abs(x-cur)<=2));if(!o.length)o=set.filter(x=>x!==cur);cur=pick(o);s.push(cur)}return s}

const WHY={"b1": ["Savoir où sont les 12 notes et comment le clavier se répète.", "Sans ça, impossible de te repérer sur n'importe quel piano ou clavier."], "b2": ["Comprendre la gamme majeure : 7 notes qui donnent le « son » d'une chanson.", "Presque toutes les chansons pop sont construites sur une gamme : c'est le décor de tout ce qui suit."], "b3": ["Numéroter les notes de 1 à 7 au lieu de les nommer.", "Un numéro marche dans toutes les tonalités : tu peux jouer une chanson plus haut ou plus bas sans tout réapprendre."], "b4": ["Jouer la gamme majeure au clavier, dans le bon ordre.", "C'est la base de tes mains : toutes les mélodies sortent de cette gamme."], "1a": ["Reconnaître si une note est posée (le 1, la maison) ou plus haute et ouverte (le 5).", "Quand tu fredonnes une chanson, tu sens où elle se pose : c'est ça que tu apprends à nommer. Sans la maison, tu ne peux pas retrouver la tonalité d'un morceau."], "1b": ["Distinguer les 3 notes stables : 1, 3, 5.", "Ce sont les notes sur lesquelles une mélodie peut s'arrêter : repère-les, et tu sais où une phrase se termine."], "1c": ["Reconnaître le 2, qui veut retomber.", "Dans une mélodie, le 2 est souvent un passage : savoir qu'il retombe sur le 1 t'aide à deviner la note suivante."], "rp": ["Associer chaque degré à une chanson que tu connais.", "Quand tu entends une note inconnue, tu la compares à un air en tête. C'est la méthode que les musiciens à l'oreille utilisent vraiment."], "1h": ["Trouver 1 – 3 – 5 au clavier.", "Ces trois notes forment l'accord de la maison : tu le joueras sous presque toutes les chansons."], "c1": ["Savoir construire un accord à 3 notes.", "Pour accompagner ta voix, tu dois fabriquer un accord toi-même, pas le copier d'un tableau."], "2a": ["Entendre si un accord est majeur (clair) ou mineur (sombre).", "C'est la première chose que tu perçois en écoutant les accords d'une chanson : triste ou lumineuse."], "c2": ["Voir quels accords existent dans une tonalité : I, IV, V, vi…", "Quan  une chanson et tu peux les reproduire."], "r7": ["Jouer un accord en rythme.", "Tu apprends à garder le rythme avec les mains, comme pour t'accompagner au chant."], "e1": ["Comprendre comment une mélodie monte, descend ou reste.", "C'est la première chose qui te permet de la retrouver à l'oreille : suivre sa direction."], "4a": ["Retrouver une mélodie de 3 notes par pas.", "Pour jouer une chanson à l'oreille, tu retrouves ses notes une par une, en commençant par les phrases courtes."], "4b": ["Retrouver 3 notes quand elles sautent.", "Les vraies mélodies ne bougent pas qu'à côté : elles sautent."], "4c": ["Retrouver 4 notes.", "Une phrase de chanson fait souvent 4 à 6 notes : tu t'en rapproches."], "4d": ["Retrouver une phrase de 5 notes.", "C'est la taille d'un début de refrain : tu peux le jouer à l'oreille."], "4e": ["Retrouver le début d'une chanson que tu connais.", "C'est l'objectif final : jouer sans partition."], "f1": ["Connaître les tonalités principales.", "Une chanson est écrite dans une tonalité : tu dois la trouver pour jouer les bonnes notes."], "5f": ["Trouver la tonalité d'une chanson au clavier.", "Tu chantes ta chanson, tu cherches la maison au clavier, et le reste suit."], "p1": ["Découvrir le ♭VII.", "C'est l'accord de très nombreux morceaux rock et pop : tu le reconnaîtras."], "p2": ["Reconnaître le ♭VII parmi d'autres accords.", "Dans une chanson, un accord « étrange » mais familier est souvent ce ♭VII."], "p3": ["Retrouver des grilles avec ♭VII.", "Tu peux relever des chansons rock avec ce que tu as appris."], "p5": ["Jouer I – ♭VII – IV.", "Cette boucle accompagne beaucoup de chansons à la guitare et au piano."], "m0": ["Comprendre le mode mineur.", "Une chanson triste est souvent en mineur : tu dois connaître ses accords."], "m3": ["Reconnaître les accords du mineur.", "Pour accompagner une chanson en mineur, tu dois savoir quels accords utiliser."], "m4": ["Retrouver des grilles en mineur.", "Tu relèves les chansons mélancoliques."], "m5": ["Retrouver des mélodies en mineur.", "Tu peux jouer à l'oreille les mélodies sombres, pas seulement les claires."], "mk": ["Jouer le mode mineur au clavier.", "Tes mains connaissent les deux « couleurs » : clair et sombre."], "6a": ["Ajouter les accords ii et iii.", "Ils apparaissent dans de nombreuses chansons : tu entends enfin des grilles plus riches."], "6b": ["Retrouver des grilles avec ii et iii.", "Tu relèves des chansons moins basiques."], "6c": ["Retrouver de longues mélodies.", "C'est la taille d'un vrai couplet."], "6e": ["Jouer ta première chanson complète.", "Tu mets tout ensemble : accords, rythme, voix."], "6d": ["Tester tout ce que tu sais.", "Si tu réussis, tu sais écouter une chanson et en trouver les accords et la mélodie."]};
Object.assign(WHY,WHY_A);
function whyHTML(id){const w=WHY[id];return w?`<div class="card why" style="gap:4px;display:grid"><div class="small"><b>Objectif.</b> ${w[0]}</div><div class="small"><b>Dans la vraie vie.</b> ${w[1]}</div></div>`:''}
function renderIntro(id){const l=LESSONS.find(x=>x.id===id),gi=LESSONS.indexOf(l);
 if(!unlocked(gi)){toast('Réussis la leçon précédente à 80 % pour débloquer celle-ci');return}
 view='intro';const u=U[l.unit],k=l.minor?MKEYS[0]:KEYS[0];CK=k;CHL=l;
 let ex='';
 if(l.type==='deg')ex=l.set.map(d=>`<button class="lbtn" data-ex="deg" data-d="${d}">${I.play}${d}${S.showNames?' · '+noteName(k,d):''}</button>`).join('');
 if(l.type==='chord')ex=l.set.map(d=>`<button class="lbtn" data-ex="chord" data-d="${d}">${I.play}${RR()[d-1]}${S.showNames?' · '+chordName(k,d):''}</button>`).join('');
 if(l.type==='rhy')ex=l.pats.slice(0,3).map((p,i)=>`<button class="lbtn" data-ex="rhy" data-d="${i}">${I.play}Exemple ${i+1}</button>`).join('');
 if(l.type==='qual')ex=`<button class="lbtn" data-ex="maj">${I.play}Majeur</button><button class="lbtn" data-ex="min">${I.play}Mineur</button>`;
 if(l.type==='progid')ex=FAMOUS.map((f,i)=>`<button class="lbtn" data-ex="fam" data-d="${i}">${I.play}${f.p.map(d=>RR()[d-1]).join('–')}</button>`).join('');
 app.innerHTML=`<div class="qtop"><button class="xbtn" data-go="home" aria-label="Fermer">${I.close}</button><span class="eyebrow">Unité ${u.n} · ${u.title}</span></div>
 <div class="stack intro"><h1>${l.t}</h1><p>${l.intro}</p>${whyHTML(l.id)}${ex?`<div class="stack" style="gap:8px"><div class="eyebrow">Écoute avant de commencer${l.type==='deg'||l.type==='chord'?' (en '+keyName(k)+', avec la cadence)':''}</div><div class="lbtns">${ex}</div></div>`:''}
 ${l.type==='deg'&&!l.minor?`<div class="stack" style="gap:8px"><div class="eyebrow">L'échelle des notes</div><div class="vis">${ladderHTML(0,0)}<p class="small muted">Touche une marche pour l'entendre et voir où elle retombe. Marches pleines : notes posées (1, 3, 5). Marches en pointillés : notes en suspens (2, 4, 6, 7). La bille montre le chemin vers la maison.</p></div></div>`:''}${l.type==='deg'&&!l.minor?repBlock(l.set):''}<div class="tip"><b>Astuce.</b> ${l.tip}</div>
 <p class="muted small">${l.n||10} questions · réussite à 80 % pour débloquer la suite${S.lessons[l.id]?.best!=null?` · ton meilleur score : ${S.lessons[l.id].best} %`:''}</p>
 <button class="btn" data-start="${l.id}">Commencer</button></div>`}

/* ===================== QUIZ ===================== */
let Q=null;
function startQuiz(lessonOrDaily){
 let qs=[],title,lesson=null;
 if(lessonOrDaily==='daily'){title='Séance du jour';const un=LESSONS.filter((l,i)=>unlocked(i)&&EAR(l));const fr=un.filter(l=>!passed(l.id)).slice(0,1);const front=fr.length?fr[0]:un[un.length-1];
  for(let i=0;i<10;i++){const l=i%2===0?front:pick(un);const q=gen(l);q.src=l.t;qs.push(q)}}
 else{lesson=LESSONS.find(x=>x.id===lessonOrDaily);title=lesson.t;for(let i=0;i<(lesson.n||10);i++)qs.push(gen(lesson))}
 lastAns=null;Q={qs,i:0,ok:0,combo:0,xp:0,title,lesson,input:[],answered:false};renderQ()}
function renderQ(){view='quiz';const q=Q.qs[Q.i],k=q.key;CK=k;Q.input=[];Q.answered=false;
 const prompts={deg:'Quel degré as-tu entendu ?',mel:'Retrouve la mélodie, note par note',chord:'Quel accord as-tu entendu ?',qual:'Majeur ou mineur ?',prog:"Retrouve la grille d'accords",progid:'Quelle grille célèbre est-ce ?',rhy:'Quel rythme as-tu entendu ?'};
 let ans='';
 if(q.type==='deg'||q.type==='mel'){ans=`<div class="answers deg">${q.opts.map(d=>`<button class="ans" data-a="${d}" style="border-color:${DCOL[d]}"><b style="color:${DCOL[d]}">${d}</b>${S.showNames?`<span>${noteName(k,d)}</span>`:''}</button>`).join('')}</div>`}
 else if(q.type==='chord'||q.type==='prog'){ans=`<div class="answers chd">${q.opts.map(d=>`<button class="ans" data-a="${d}" style="border-color:${DCOL[d]}"><b style="color:${DCOL[d]}">${RR()[d-1]}</b>${S.showNames?`<span>${chordName(k,d)}</span>`:''}</button>`).join('')}</div>`}
 else if(q.type==='qual'){ans=`<div class="answers chd"><button class="ans" data-a="maj"><b>Majeur</b><span>lumineux</span></button><button class="ans" data-a="min"><b>Mineur</b><span>sombre</span></button></div>`}
 else if(q.type==='progid'){ans=`<div class="answers list">${FAMOUS.map((f,i)=>`<button class="ans long" data-a="${i}"><b>${f.p.map(d=>RR()[d-1]).join(' – ')}</b><span>${f.nick}</span></button>`).join('')}</div>`}
 if(q.type==='rhy')ans=`<div class="answers list">${q.opts.map((p,i)=>`<button class="ans long rgans" data-a="${i}">${rgHTML(p)}</button>`).join('')}</div>`;
 const seq=(q.type==='mel'||q.type==='prog');
 app.innerHTML=`<div class="quizwrap"><div class="qtop"><button class="xbtn" data-act="quit" aria-label="Quitter">${I.close}</button><div class="bar"><i style="width:${(Q.practice?(Q.i%10)/10:Q.i/Q.qs.length)*100}%"></i></div><span class="pill" style="color:var(--accent)">${I.flame}${Q.combo}</span></div>
 <div class="prompt"><span class="eyebrow">${q.src?q.src+' · ':''}${q.type==='qual'||q.type==='progid'||q.type==='rhy'?'':'Tonalité : '+keyName(k)}</span><h2>${prompts[q.type]}</h2></div>
 <button class="playbig" data-act="replay" aria-label="Réécouter">${I.play}</button>
 <div class="lbtns" style="justify-content:center">${q.type!=='qual'&&q.type!=='progid'&&q.type!=='rhy'?`<button class="lbtn" data-act="cad">${I.play}Cadence seule</button>`:''}${q.type==='deg'||q.type==='mel'?`<button class="lbtn" data-act="tonic">${I.play}Note maison (1)</button>`:''}${['deg','mel','chord','prog'].includes(q.type)?`<button class="lbtn" data-act="solo">${I.play}${{deg:'Note seule',mel:'Mélodie seule',chord:'Accord seul',prog:'Grille seule'}[q.type]}</button>`:''}</div>
 ${seq?`<div class="slots">${q.ans.map((_,i)=>`<div class="slot" data-slot="${i}">${q.type==='prog'&&i===0&&q.lesson.len<4?'':''}</div>`).join('')}</div><div class="lbtns" style="justify-content:center;margin-top:8px"><button class="lbtn" data-act="undo">Effacer la dernière</button></div>`:''}
 ${ans}</div>`;
 setTimeout(()=>playQ(q),250)}
function updateSlots(){const q=Q.qs[Q.i];app.querySelectorAll('.slot').forEach((s,i)=>{const v=Q.input[i];if(v!=null){s.textContent=q.type==='prog'?RR()[v-1]:v;s.classList.add('f');s.style.background=DCOL[v]}else{s.textContent='';s.classList.remove('f');s.style.background=''}})}
function answer(raw){if(Q.answered)return;const q=Q.qs[Q.i];
 if(q.type==='mel'||q.type==='prog'){Q.input.push(+raw);updateSlots();const d=+raw;q.type==='mel'?(()=>{const t=newBus();tone(degMidi(q.key,d),t,.8,.6)})():(()=>{const t=newBus();playChord(chordMidis(q.key,d),t,.6,.45)})();if(Q.input.length<q.ans.length)return;return check(Q.input.slice())}
 const v=q.type==='qual'?raw==='min':+raw;check(v)}
function check(v){const q=Q.qs[Q.i];Q.answered=true;let ok;
 if(Array.isArray(q.ans))ok=v.every((x,i)=>x===q.ans[i]);else ok=v===q.ans;
 q.given=v;q.ok=ok;
 // stats
 S.stats.t++;if(ok)S.stats.c++;
 const bump=(o,key)=>{o[key]=o[key]||{c:0,t:0};o[key].t++;if(ok)o[key].c++};
 if(q.type==='deg')bump(S.stats.deg,q.ans);if(q.type==='chord')bump(S.stats.chd,q.ans);
 if(q.type==='mel')q.ans.forEach((d,i)=>{S.stats.deg[d]=S.stats.deg[d]||{c:0,t:0};S.stats.deg[d].t++;if(v[i]===d)S.stats.deg[d].c++});
 const hd=S.hist[dayKey()]||(S.hist[dayKey()]={n:0,c:0});hd.n++;if(ok)hd.c++;
 if(q.lid){const ma=S.mast[q.lid]||(S.mast[q.lid]=[]);ma.push(ok?1:0);if(ma.length>20)ma.shift()}
 const rc=(o,key,r)=>{const a=o[key]||(o[key]=[]);a.push(r?1:0);if(a.length>12)a.shift()};
 if(q.type==='deg')rc(S.rec.deg,q.ans,ok);else if(q.type==='chord')rc(S.rec.chd,q.ans,ok);
 else if(q.type==='mel')q.ans.forEach((d,i)=>rc(S.rec.deg,d,v[i]===d));else if(q.type==='prog')q.ans.forEach((d,i)=>rc(S.rec.chd,d,v[i]===d));
 if(Q.practice)planNow().tr++;
 if(ok){Q.ok++;Q.combo++;Q.best=Math.max(Q.best||0,Q.combo);const gain=10+Math.min(Q.combo,5)*2;Q.xp+=gain;S.xp+=gain}else Q.combo=0;
 tickDaily();
 if(S.stats.t>=100)award('q100');if(S.stats.t>=500)award('q500');if(S.stats.t>=1000)award('q1000');
 save();
 if(Array.isArray(q.ans))app.querySelectorAll('.slot').forEach((s,i)=>s.classList.add(v[i]===q.ans[i]?'ok':'ko'));
 showFeedback(q,ok)}

let FB={};
function chip(d,kind){return `<span class="chip" style="background:${DCOL[d]}">${kind==='chd'?RR()[d-1]:d}</span>`}
function explain(q,ok){const k=q.key,v=q.given;CK=k;FB={};let h='',btn='';
 const nm=d=>S.showNames?` (${noteName(k,d)})`:'';const cn=d=>S.showNames?` (${chordName(k,d)})`:'';
 if(q.type==='deg'){const d=q.ans,a=v;
  FB.c=()=>playDeg(k,d,q.oct,true,true);FB.x=()=>cycleAlt('d',d);FB.y=()=>playDeg(k,a,q.oct,true,true);
  h=ok?`<p>C'était bien <b>${DG()[d].n}</b>${nm(d)}. <span id="alt">${expl('d',d)}</span></p><p class="muted small">Écoute : ${resTxt(d)}. Chante-le.</p>`
   :`<p>C'était <b>${DG()[d].n}</b>${nm(d)}, pas le ${a}.</p><p id="alt">${expl('d',d)}</p><p class="muted">Le ${a}, lui : ${DG()[a].t.charAt(0).toLowerCase()+DG()[a].t.slice(1)}</p><p class="small">${contrastD(d,a)}</p>`;
  btn=`<button class="lbtn" data-fb="c">${I.play}Le ${d} (bonne réponse)</button>${ok?'':`<button class="lbtn" data-fb="y">${I.play}Le ${a} (ta réponse)</button>`}`;
  h=`<div class="vis">${ladderHTML(d,ok?0:a)}<p class="small muted">Marches pleines : notes posées. Pointillées : notes en suspens. La bille montre où la note retombe${ok?'':' (cadre vert : la bonne réponse, rouge : ta réponse)'}.</p></div>`+h;
  if(!k.m&&REP[d]){h+=`<p class="small">${repHow(d)}</p>`;FB.r=()=>playRep(k,d,true);btn+=`<button class="lbtn" data-fb="r">${I.play}Repère : ${REP[d].s}</button>`}}
 else if(q.type==='chord'){const d=q.ans,a=v;FB.c=()=>playChordSolo(k,d,true);FB.y=()=>playChordSolo(k,a,true);FB.x=()=>cycleAlt('c',d);
  h=`<p>${ok?'':`C'était le <b>${RR()[d-1]}</b>${cn(d)}, pas le ${RR()[a-1]}.<br>`}<span id="alt">${expl('c',d)}</span></p>${ok?'':`<p class="muted">${contrastC(d,a)}</p>`}<p class="small">La basse jouait ${d>7?'la note':'le <b>'+d+'</b>'}${nm(d)} : la note la plus grave donne le degré de l'accord.</p>`;
  h=fmapHTML(d,ok?0:a)+h;
  btn=`<button class="lbtn" data-fb="c">${I.play}${RR()[d-1]} (bonne réponse)</button>${ok?'':`<button class="lbtn" data-fb="y">${I.play}${RR()[a-1]} (ta réponse)</button>`}`}
 else if(q.type==='qual'){FB.c=()=>{const t=newBus();playChord(q.chord,t,1.4,.55)};const r=q.chord.tri[0];FB.o=()=>{const t=newBus();playChord({bass:q.chord.bass,tri:[r,r+(q.min?4:3),r+7]},t,1.4,.55)};
  h=`<p>${ok?'Oui, ':''}c'était un accord <b>${q.min?'mineur':'majeur'}</b>. ${q.min?'Plus sombre, émouvant : la note du milieu (le 3) est un demi-ton plus bas.':'Stable, lumineux : la note du milieu (le 3) est un demi-ton plus haut que dans le mineur.'}</p><p class="small">Méthode : écoute la note du milieu de l'accord. Majeur : claire et ouverte. Mineur : plus sombre. Appuie sur « l'autre » pour comparer : une seule note change.</p>`;
  h=triHTML(q.min)+h;
  btn=`<button class="lbtn" data-fb="c">${I.play}${q.min?'Mineur':'Majeur'} (entendu)</button><button class="lbtn" data-fb="o">${I.play}${q.min?'Majeur':'Mineur'} (l'autre)</button>`}
 else if(q.type==='mel'||q.type==='prog'){const kind=q.type==='mel'?'deg':'chd';FB.c=()=>playSeq(k,q.ans,q.type);FB.y=()=>playSeq(k,v,q.type);
  const fam=q.type==='prog'?FAMOUS.find(f=>f.p.join()===q.ans.join()):null;
  const wrongI=q.ans.findIndex((d,i)=>d!==v[i]);
  h=`<div class="stack" style="gap:6px"><div class="seqrow"><span class="small muted" style="width:92px">Bonne réponse</span>${q.ans.map(d=>chip(d,kind)).join('')}</div>${ok?'':`<div class="seqrow"><span class="small muted" style="width:92px">Ta réponse</span>${v.map(d=>chip(d,kind)).join('')}</div>`}</div>`;
  if(q.type==='mel'){h+=contourHTML(q.ans,v,ok?-1:wrongI);h+=ok?`<p>Bravo, la mélodie est juste. Elle commence sur ${DG()[q.ans[0]].n.toLowerCase()} et finit sur le ${q.ans[q.ans.length-1]} : ${DG()[q.ans[q.ans.length-1]].s?'une note stable, la phrase se pose.':'une note instable, la phrase reste en suspens.'}</p>`
   :`<p>L'erreur commence à la note ${wrongI+1} : c'était le <b>${q.ans[wrongI]}</b>${nm(q.ans[wrongI])}, pas le ${v[wrongI]}.</p><p class="small">${melHow(q.ans,v,wrongI)}</p><p class="small">${expl('d',q.ans[wrongI])}</p>`;
}
  else{h+=ok?`<p>Grille juste !</p>`:`<p>L'erreur commence à l'accord ${wrongI+1} : c'était le <b>${RR()[q.ans[wrongI]-1]}</b>${cn(q.ans[wrongI])}, pas le ${RR()[v[wrongI]-1]}.</p>${fmapHTML(q.ans[wrongI],v[wrongI])}<p class="small">${contrastC(q.ans[wrongI],v[wrongI])}</p><p class="small">${expl('c',q.ans[wrongI])}</p>`;
   if(fam)h+=`<p class="small">C'est <b>${fam.nick.toLowerCase()}</b>, celle de ${fam.songs}.</p>`;

2:[`Méthode : chante 1 – 2 – 1. Si la note mystère est celle du milieu, un pas au-dessus de la maison, c'est le 2.`,`Test de l'arrêt : arrête-toi dessus : ça sonne en suspens, tu veux redescendre d'un pas vers la maison.`,`Il est tout près de la maison : un pas au-dessus. Si la note est plus loin, ce n'est pas le 2.`],
3:[`Méthode : chante 1 – 2 – 3. Le 3 est la 3e note de la gamme, deux pas au-dessus de la maison.`,`Test de l'arrêt : tu peux t'arrêter dessus. Contrairement au 1, elle sonne lumineuse, comme un sourire.`,`C'est la note du milieu de l'accord de la maison (1 – 3 – 5) : si tu entends l'accord, c'est celle du milieu.`],
4:[`Méthode : chante 1 – 2 – 3 – 4. Le 4 est la 4e note : juste au-dessus du 3 et juste en dessous du 5.`,`Test de l'arrêt : tu ne peux pas vraiment t'arrêter dessus, ça sonne lourd. Il retombe d'un pas sur le 3.`,`Compare-le au 5 : le 5 est ouvert et on peut s'y arrêter, le 4 pèse et attend.`],
5:[`Méthode : chante 1 – 2 – 3 – 4 – 5. Le 5 est la 5e note, tout en haut de l'accord de la maison.`,`Test de l'arrêt : tu peux t'arrêter dessus, mais ça sonne ouvert, comme une demi-fin. Le 1, lui, sonne fini.`,`Compare-le au 1 : le 5 est plus haut et plus « en l'air », le 1 est le point final.`],
6:[`Méthode : chante 1 – 2 – 3 – 4 – 5 – 6. Le 6 est la 6e note, juste au-dessus du 5.`,`Test de l'arrêt : ça sonne tendre, un peu triste, instable : il retombe d'un pas sur le 5.`,`Chante 5 – 6 – 5 : ce petit balancement tendre te donne la couleur du 6.`],
7:[`Méthode : chante la gamme jusqu'au 7. C'est la dernière avant la maison, un demi-ton sous le 1 : monte d'un demi-ton et tu y es.`,`Test de l'arrêt : impossible de s'arrêter dessus, ça sonne coupé : l'oreille attend le 1.`,`C'est la note la plus tendue de la gamme : un ressort tendu qui veut monter.`]};

2:[`Méthode : mineur et plutôt doux : c'est le ii. Sa basse est au 2e pas de la gamme.`,`Rôle : il prépare le V. Cherche-le juste avant la tension, comme dans ii → V → I.`],
3:[`Méthode : mineur et rare : c'est le iii. Sa basse est au 3e pas.`,`Il ressemble au I (deux notes en commun) mais en plus sombre.`],

5:[`Méthode : en attente. Tu ne peux pas finir dessus, il appelle le I : c'est le V.`,`Basse : au 5e pas de la gamme, la note ouverte.`,`Couleur : majeur, mais « en l'air ». V → I est le mouvement le plus fort.`],

const AIDE_SYS=`Tu es l'aide d'une appli d'ear training (Oreille Pop). L'élève est un débutant français au piano ; son but : jouer des chansons à l'oreille (mélodie et accords) et s'accompagner en chantant. Réponds en français, court (5 phrases max), concret, sans jargon inutile, sans ton poétique ni commercial. Explique avec une méthode qu'il peut appliquer (chanter, comparer à la note maison, chercher au clavier). Vocabulaire de l'appli : la maison = la tonique (degré 1), degrés 1 à 7, accords en chiffres romains (I, IV, V, vi), cadence = dans l'appli, TOUJOURS les 4 accords I – IV – V – I en majeur (i – iv – V – i en mineur), qui se terminent sur l'accord de la maison : la dernière note de la cadence est donc toujours le degré 1 (la tonique). Elle est jouée avant chaque question, dans une tonalité qui change à chaque question. Ne contredis jamais ces faits de l'appli (en musique en général une cadence peut finir ailleurs, mais pas ici). Grille = suite d'accords. Sur la méthode : on chante la dernière note de la cadence pour avoir la maison, puis on compare la note mystère à elle. Si tu n'es pas sûr, dis-le. Si la question n'a pas de rapport avec la musique ou l'appli, ramène-la poliment au sujet.`;

function midBox(){const el=document.getElementById('midbox');if(!el)return;const st=MD.steps[MD.si];

 el.innerHTML=`${done}${MD.msg?`<div style="margin-top:6px;color:var(--gold)">${MD.msg}</div>`:''}${MD.wrong?`<div class="muted" style="margin-top:6px">Notes à côté : ${MD.wrong}</div>`:''}${MD.reg!=null?`<div class="muted" style="margin-top:6px">Régularité : ${MD.reg}</div>`:''}`}
function midNote(m,ts){if(!MD||MD.fin)return;const st=MD.steps[MD.si],ev=st.ev[MD.ei];if(!ev)return;const p=pc(m);

 if(ev.p.length===1){
  if(p===ev.p[0]){MD.tt.push(ts);midEvDone(ts)}

 }else{
  if(ev.p.includes(p)){if(!MD.got.size)MD.cs=ts;if(ts-MD.cs>1500){MD.got=new Set();MD.cs=ts;MD.gm={}}MD.got.add(p);MD.gm=MD.gm||{};MD.gm[p]=m;

    MD.tt.push(ts);midEvDone(ts)}}
  else{if(MD.lastDone&&ts-MD.lastDone<800)return;MD.wrong++;MD.got=new Set();midBox()}}}
function midEvDone(ts){MD.lastDone=ts;MD.got=new Set();MD.gm={};MD.cnt=0;MD.msg='';MD.ei++;const st=MD.steps[MD.si];
 if(MD.ei>=st.ev.length){MD.ok++;midStepDone(st);return}
 const kb=document.getElementById('midkb');if(kb){const ms=MD.steps.flatMap(s=>s.ev.flatMap(e=>e.hl.map(x=>x.m)));const from=Math.floor(Math.min(48,...ms)/12)*12;kb.innerHTML=kbHTML(midHL(st),{from,to:Math.max(72,...ms,from+24)})}

 const el=document.getElementById('midbox');if(el)midBox();
 const last=MD.si>=MD.steps.length-1;const kb=document.getElementById('midkb');if(kb)kb.classList.add('midok');

 `<h1>Comment nommer les notes ?</h1><p class="muted">Tu pourras changer plus tard dans les réglages.</p><div class="answers chd"><button class="ans" data-obnot="fr" style="${S.notation==='fr'?'border-color:var(--accent)':''}"><b>Do Ré Mi</b><span>noms français</span></button><button class="ans" data-obnot="en" style="${S.notation==='en'?'border-color:var(--accent)':''}"><b>C D E</b><span>noms anglais</span></button></div><button class="btn" data-ob="3">Continuer</button>`,
 `<h1>À quelle heure te rappeler ?</h1><p class="muted">Choisis un moment où tu as 10 minutes au calme, avec un casque si possible.</p><div class="card setrow"><label for="obrem">Rappel quotidien</label><input type="time" id="obrem" value="${S.reminder}"></div><button class="btn" data-ob="done">Commencer le parcours</button>`];
 app.innerHTML=`<div class="onb stack">${steps[ob]}<p class="small muted" style="text-align:center">${ob+1} / 4</p></div>`}

/* ===================== UTILITAIRES ===================== */
function award(id){if(S.badges.includes(id))return;S.badges.push(id);save();const b=BADGES.find(x=>x.id===id);if(b)setTimeout(()=>toast('Trophée débloqué : '+b.t),400)}
let toastT;function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}
function go(v){CK=KEYS[0];resetArm=false;if(v==='home')renderHome();else if(v==='train')renderTrain();else if(v==='progress')renderProgress();else if(v==='settings')renderSettings();window.scrollTo(0,0)}

/* ===================== ÉVÉNEMENTS ===================== */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
 if(ds.recap){audio();RECAP[ds.recap].d(KEYS[0]);return}
 if(ds.go){go(ds.go);return}
 if(ds.trk){S.tr=ds.trk;save();renderHome.scrolled=false;renderHome();window.scrollTo(0,0);return}
 if(ds.song){startSong(ds.song);window.scrollTo(0,0);return}
 if(ds.startMid){audio();startMid(ds.startMid);return}
 if(ds.mk!=null&&view==='mid'){MD.key=(MD.l.keys||KEYS)[+ds.mk];midBuild();drawMid();return}
 if(ds.mid&&view==='mid'){audio();const st=MD.steps[MD.si];
  if(ds.mid==='demo'){const ce=st.ev[MD.ei];if(ce&&ce.bk){playSeqM([ce.bk],2.2);return}if(st.cue){playSeqM(st.cue,st.cueGap||.6);return}const seq=st.ev.map(e=>e.hl.map(x=>x.m));playSeqM(seq,st.timed?60/(st.bpm||66)*.8:.7)}
  else if(ds.mid==='met'){midMetro();drawMid()}
  else if(ds.mid==='aid'){if(!MD.noaid&&!st.listen){MD.noaid=true;MD.reveal=false}else MD.reveal=!MD.reveal;drawMid()}
  else if(ds.mid==='reset'){MD.wrong=0;MD.reg=null;midStepReset();drawMid()}
  else if(ds.mid==='skip'){MD.skipped++;MD.wrongTot+=MD.wrong;if(MD.si>=MD.steps.length-1){midFinish()}else{MD.si++;MD.wrong=0;midStepReset();MD.reg=null;drawMid()}}
  return}
 if(ds.lesson){audio();openLesson(ds.lesson);return}
 if(ds.pk){startPractice({k:ds.pk,v:ds.pv});window.scrollTo(0,0);return}
 if(ds.startLearn){audio();startLearn(ds.startLearn);window.scrollTo(0,0);return}
 if(ds.lk!=null){LN.key=(LN.pk||KEYS)[+ds.lk];redraw();return}
 if(ds.ls!=null){LN.si=+ds.ls;redraw();return}
 if(ds.ld!=null){audio();const pg=LN.mode==='kb'?LN.l:LN.l.pages[LN.p];const s=pg.sel?pg.sel[LN.si].v:null;pg.demos[+ds.ld].run(LN.key,s);return}
 if(ds.m!=null&&(view==='learn'||view==='kb')){tap(+ds.m);return}
 if(ds.m!=null&&view==='mid'){tap(+ds.m);midNote(+ds.m,performance.now());return}
 if(ds.lq!=null){lAnswer(+ds.lq);return}
 if(ds.start){audio();startQuiz(ds.start);window.scrollTo(0,0);return}
 if(ds.ex){const k=CK;if(ds.ex==='lad'){const n=+ds.d;playDeg(k,n===8?1:n,n===8?1:0,n!==8,true);ladderAnim(n);return}if(ds.ex==='rep')playRep(k,+ds.d,true);if(ds.ex==='rhy')playPat(CHL.pats[+ds.d]);if(ds.ex==='deg')playDeg(k,+ds.d,0,true,true);if(ds.ex==='chord')playChordSolo(k,+ds.d,true);if(ds.ex==='maj'||ds.ex==='min'){const t=newBus();playChord({bass:48,tri:[60,ds.ex==='min'?63:64,67]},t,1.4,.55)}if(ds.ex==='fam'){let t=newBus();FAMOUS[+ds.d].p.forEach((d,i)=>playChord(chordMidis(k,d),t+i,.9,.5))}return}
 if(ds.a!=null&&view==='quiz'){answer(ds.a);return}
 if(ds.fb&&FB[ds.fb]){FB[ds.fb]();return}
 if(ds.min){S.minutes=+ds.min;save();renderSettings();return}
 if(ds.not){S.notation=ds.not;save();renderSettings();return}
 if(ds.obmin){S.minutes=+ds.obmin;save();renderOnb();return}
 if(ds.obnot){S.notation=ds.obnot;save();renderOnb();return}
 if(ds.ob){const r=document.getElementById('obrem');if(r)S.reminder=r.value||S.reminder;if(ds.ob==='done'){S.onboarded=true;save();audio();renderHome();window.scrollTo(0,0)}else{ob=+ds.ob;renderOnb()}return}
 const act=ds.act;if(!act)return;
 if(act==='daily'){audio();renderPlan();window.scrollTo(0,0)}
 else if(act==='plan'){renderPlan();window.scrollTo(0,0)}
 else if(act==='chal'){openChal()}
 else if(act==='prac'){startPrac();window.scrollTo(0,0)}
 else if(act==='chaldone'){chalDone()}
 else if(act==='lquit'){go('home')}
 else if(act==='lprev'){LN.p--;LN.si=0;drawLearn();window.scrollTo(0,0)}
 else if(act==='lnext2'){if(LN.p>=LN.l.pages.length-1){LN.mode='q';LN.qi=0;LN.ok=0;LN.answered=false;LN.ordQ=-1}else{LN.p++;LN.si=0}drawLearn();window.scrollTo(0,0)}
 else if(act==='lnext'){LN.answered=false;LN.qi++;if(LN.qi>=LN.l.qs.length)finishLearn();else drawLearn();window.scrollTo(0,0)}
 else if(act==='kbdone'){kbDone()}
 else if(act==='bkcopy'){const txt=JSON.stringify(S),el=document.getElementById('bk');el.value=txt;el.select();(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Sauvegarde copiée')).catch(()=>toast('Texte sélectionné : copie-le à la main'))}
 else if(act==='bkrestore'){try{const r=JSON.parse(document.getElementById('bk').value);if(!r||typeof r!=='object'||!r.lessons)throw 0;applyRemote(r,true);toast('Sauvegarde restaurée')}catch(e){toast('Sauvegarde invalide')}}
 else if(act==='replay'){playQ(Q.qs[Q.i])}
 else if(act==='solo'){playQ(Q.qs[Q.i],false)}
 else if(act==='cad'){let t=newBus();cadence(Q.qs[Q.i].key,t)}
 else if(act==='tonic'){const t=newBus(),k=Q.qs[Q.i].key,tn=tonic(k),c=chordMidis(k,1),m=c.tri.find(x=>x%12===tn%12)||tn;tone(m,t,1.5,.7)}
 else if(act==='undo'){if(!Q.answered){Q.input.pop();updateSlots()}}
 else if(act==='next'){next();window.scrollTo(0,0)}
 else if(act==='quit'){quitQuiz()}
 else if(act==='again'){startPractice(PR);window.scrollTo(0,0)}
 else if(act==='names'){S.showNames=!S.showNames;save();renderSettings()}
 else if(act==='miditest'){midiTest()}
 else if(act==='free'){S.free=!S.free;save();renderSettings()}
 else if(act==='test'){let t=newBus();cadence(KEYS[0],t)}
 else if(act==='reset'){if(!resetArm){resetArm=true;renderSettings()}else{S=structuredClone(DEF);S.onboarded=true;save();resetArm=false;toast('Progression effacée');renderSettings()}}
});
document.addEventListener('change',e=>{if(e.target.id==='rem'){S.reminder=e.target.value;save();toast('Rappel réglé à '+S.reminder)}});
document.addEventListener('keydown',e=>{if(view!=='quiz')return;if(e.key===' '){e.preventDefault();playQ(Q.qs[Q.i])}if(e.key==='Enter'&&Q.answered){next()}if(/^[1-7]$/.test(e.key)&&!Q.answered){const q=Q.qs[Q.i];if((q.opts||[]).includes(+e.key))answer(e.key)}});

if(S.onboarded)renderHome();else renderOnb();

/* ===================== SAUVEGARDE SUR LE COMPTE ===================== */
/* La progression est copiée dans la base privée du compte (db, data/users/<id>) : elle suit l'utilisateur d'un appareil à l'autre. Le plus récent gagne. */
const SYNC={ref:null,t:null,busy:false,state:'local'};
/* Synchro hors de Claude : Firebase (Firestore, accès REST), clé fixe, un seul utilisateur */
const FBS={proj:'oreille-sync',key:'AIzaSyAp02wtDCEBV-QcFHVmv0bzFPYBUsWFn_A',doc:'cc36197e7c2b98601a4d9f64fc09c074'};
function fbRef(){const url=`https://firestore.googleapis.com/v1/projects/${FBS.proj}/databases/(default)/documents/progress/${FBS.doc}?key=${FBS.key}`;
 return {async get(){const r=await fetch(url);if(r.status===404)return {exists:false};if(!r.ok)throw new Error('fb '+r.status);const j=await r.json();const f=j.fields||{};return {exists:!!f.data,data:()=>JSON.parse(f.data.stringValue)}},
  async set(o){const r=await fetch(url+'&updateMask.fieldPaths=data',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{data:{stringValue:JSON.stringify(o)}}})});if(!r.ok)throw new Error('fb '+r.status)}}}
function syncMsg(){return SYNC.state==='ok'?(SYNC.fb?'Ta progression est sauvegardée en ligne : tu la retrouves sur tous tes appareils.':'Ta progression est sauvegardée sur ton compte Claude : tu la retrouves sur ton iPhone comme sur ton Mac.'):SYNC.state==='err'?"La sauvegarde en ligne n'a pas abouti. Ta progression reste sur cet appareil : réessaie plus tard.":'Ta progression est enregistrée sur cet appareil seulement (connecte-toi à Claude pour la sauvegarder sur ton compte).'}
function syncUI(){const el=document.getElementById('syncmsg');if(el)el.textContent=syncMsg()}
function syncPush(){if(!SYNC.ref)return;clearTimeout(SYNC.t);SYNC.t=setTimeout(async()=>{if(SYNC.busy){syncPush();return}SYNC.busy=true;try{await SYNC.ref.set(JSON.parse(JSON.stringify(S)));SYNC.state='ok'}catch(e){SYNC.state='err'}SYNC.busy=false;syncUI()},1500)}
function applyRemote(r,restamp){S={...structuredClone(DEF),...r,stats:{...DEF.stats,...(r.stats||{})},streak:{...DEF.streak,...(r.streak||{})},rec:{deg:{},chd:{},...(r.rec||{})}};if(restamp)S.upd=Date.now();try{localStorage.setItem('oreillePop',JSON.stringify(S))}catch(e){}if(restamp)syncPush();
 if(['quiz','learn','kb','result','intro'].includes(view))return;
 if(!S.onboarded)renderOnb();else if(view==='train')renderTrain();else if(view==='progress')renderProgress();else if(view==='settings')renderSettings();else renderHome()}
async function syncPull(){try{const snap=await SYNC.ref.get();
 if(snap.exists&&(snap.data().upd||0)>(S.upd||0)){applyRemote(snap.data());SYNC.state='ok';syncUI();return}
 SYNC.state='ok';if(S.upd)syncPush();syncUI()}catch(e){SYNC.state='err';syncUI()}}
async function syncInit(){try{if(!window.claude||!claude.use){SYNC.fb=true;SYNC.ref=fbRef();await syncPull();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!['quiz','learn','kb','mid'].includes(view))syncPull()});return}const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;
 SYNC.ref=db.doc('data/users/'+id+'/progress');await syncPull();
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!['quiz','learn','kb','mid'].includes(view))syncPull()})}catch(e){}}
syncInit();midiInit();
</script>
