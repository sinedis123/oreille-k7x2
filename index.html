<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:dark}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Oreille Pop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app, max 520px, path map + bottom tab bar. Deliberate single dark "night stage" look. */
:root{
  --bg:#121426; --surface:#1c1f38; --surface2:#262a4a; --line:#353a64;
  --fg:#f3f1ff; --muted:#a3a7cc; --accent:#ff7a45; --accent2:#ffb38f;
  --good:#3ddc97; --bad:#ff5c7a; --gold:#ffc94a;
  --d1:#ff5c5c; --d2:#ff9f43; --d3:#ffd43b; --d4:#51cf66; --d5:#4dabf7; --d6:#9775fa; --d7:#f783ac;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;position:relative}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:16px;background:var(--accent);color:#1a0d06;font-weight:700;font-size:17px;box-shadow:0 5px 0 #c4501f;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c4501f}
.btn.ghost{background:var(--surface2);color:var(--fg);box-shadow:0 5px 0 #15172c}
.btn.good{background:var(--good);color:#06291a;box-shadow:0 5px 0 #23a26c}
.btn.bad{background:var(--bad);color:#2b0610;box-shadow:0 5px 0 #c03553}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border-radius:20px;padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:6px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.flame{color:var(--accent)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:20}
.tabs .in{display:flex;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:12px;font-weight:700;color:var(--muted)}
.tab[aria-current="true"]{color:var(--accent)}
.tab svg{width:24px;height:24px}
/* daily card */
.daily{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:82px;height:82px}
/* path */
.goalcard{background:linear-gradient(135deg,#2b2350,#1c1f38);border:1px solid var(--line)}
.unit{margin-top:22px}
.unithead{border-radius:18px;padding:14px 16px;color:#120f22}
.recap{margin:8px 0 0;padding:10px 12px;border-radius:14px;background:var(--surface2);display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;line-height:1.4}.recap .lbtn{flex:none}
.unithead .eyebrow{color:rgba(18,15,34,.7)}
.unithead h3{font-size:19px;font-weight:800}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0 4px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:200px;text-align:center}
.bubble{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;color:#130f22;box-shadow:0 6px 0 rgba(0,0,0,.35);position:relative;transition:transform .1s}
.bubble:active{transform:translateY(3px)}
.bubble.locked{background:var(--surface2)!important;color:var(--muted);box-shadow:0 6px 0 #15172c}
.bubble.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{opacity:1;transform:scale(.92)}100%{opacity:0;transform:scale(1.15)}}
.node .lt{font-size:14px;font-weight:700;line-height:1.25}
.stars{display:flex;gap:2px;height:16px}
.stars svg{width:16px;height:16px}
.final .bubble{width:92px;height:92px;background:var(--gold)}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;padding-block:8px 18px}
.bar{flex:1;height:14px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.xbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.prompt{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.playbig{width:120px;height:120px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;margin:18px auto 8px;box-shadow:0 7px 0 #15172c;color:var(--accent)}
.playbig:active{transform:translateY(4px);box-shadow:0 3px 0 #15172c}
.playbig svg{width:52px;height:52px}
.playing .playbig{animation:breathe 1s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
.answers{display:grid;gap:10px;margin-top:22px}
.answers.deg{grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
.answers.chd{grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
.answers.list{grid-template-columns:1fr}
.ans{min-height:70px;border-radius:16px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;box-shadow:0 4px 0 #15172c;transition:transform .08s}
.ans:active{transform:translateY(3px);box-shadow:0 1px 0 #15172c}
.ans b{font-family:var(--display);font-size:26px;line-height:1}
.ans span{font-size:12px;color:var(--muted)}
.ans.long{align-items:flex-start;text-align:left;padding:12px 16px}
.ans.long b{font-size:19px}
.slots{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.slot{width:48px;height:56px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.slot.f{border-style:solid;color:#130f22}
.slot.ok{outline:3px solid var(--good)} .slot.ko{outline:3px solid var(--bad)}
/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
.sheet .in{width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) 20px max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-height:84vh;overflow-y:auto}
.sheet.ok .in{background:#123a2e} .sheet.ko .in{background:#3d1624}
.sheet h2{display:flex;align-items:center;gap:10px}
.sheet.ok h2{color:var(--good)} .sheet.ko h2{color:var(--bad)}
.sheet p{font-size:15.5px}
.lbtns{display:flex;flex-wrap:wrap;gap:8px}
.lbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:700;font-size:14px}
.lbtn svg{width:14px;height:14px}
.chip{display:inline-flex;min-width:30px;height:30px;padding:0 8px;border-radius:9px;align-items:center;justify-content:center;font-weight:800;color:#130f22;font-family:var(--display)}
.seqrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ref{font-size:12.5px;color:var(--accent2)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
/* result */
.result{text-align:center;padding-top:30px}
.bigstars{display:flex;justify-content:center;gap:10px;margin:18px 0}
.bigstars svg{width:56px;height:56px;animation:pop .4s backwards}
.bigstars svg:nth-child(2){animation-delay:.15s}.bigstars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
/* intro */
.intro p{font-size:16px}
.tip{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:14.5px}
/* progress */
.hbar{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.hbar .t{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--surface2);min-height:4px}
.week i.on{background:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--surface);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:#130f22;background:var(--gold)}
.badge.off{opacity:.4}.badge.off .medal{background:var(--surface2);color:var(--muted)}
.badge b{font-size:12.5px;line-height:1.2}
.badge span{font-size:11px;color:var(--muted);line-height:1.2}
/* settings */
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt button{padding:10px 16px;border-radius:12px;background:var(--surface2);font-weight:700;border:2px solid transparent}
.opt button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{width:52px;height:30px;border-radius:99px;background:var(--surface2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:.2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:25px;background:#fff}
input[type=time]{background:var(--surface2);border:0;color:var(--fg);padding:10px 12px;border-radius:12px;font:inherit;font-weight:700}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--gold);color:#251a00;font-weight:800;padding:12px 18px;border-radius:14px;z-index:50;animation:up .25s;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.onb{padding-top:30px}
.hero-notes{display:flex;gap:6px;margin-bottom:6px}
.hero-notes i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;color:#130f22;font-size:14px}
/* clavier à l'écran, leçons Comprendre, défis Au clavier */
.kb{position:relative;display:flex;height:150px;border-radius:6px 6px 14px 14px;overflow:hidden;background:#0b0c18;border:2px solid #0b0c18;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wk{flex:none;height:100%;background:#f3f1ff;border-right:1px solid #8f93bd;border-radius:0 0 7px 7px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 0 8px;color:#1a1730;min-width:0;transition:filter .08s,transform .08s}
.wk .kl{font-family:var(--display);font-weight:800;font-size:18px;line-height:1}
.wk .kn{font-style:normal;font-size:10px;color:#4b4d70;margin-top:2px;white-space:nowrap}
.bk{position:absolute;top:0;height:92px;background:#0b0c18;border-radius:0 0 6px 6px;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:5px;color:#fff;font-family:var(--display);font-weight:800;font-size:13px;box-shadow:inset 0 -4px 0 rgba(255,255,255,.12);transition:filter .08s,transform .08s}
.wk.hl .kl,.wk.hl .kn,.bk.hl{color:#130f22}
.wk.on,.bk.on{filter:brightness(1.3);transform:translateY(3px)}
[hidden]{display:none!important}
.mchip{font-size:13px;line-height:1.35;padding:8px 12px;border-radius:14px;background:var(--surface2);color:var(--muted);display:block}.mchip.ok{color:var(--good)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:12px;border-radius:12px;background:var(--surface2);font-weight:800;border:2px solid transparent}.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--accent2)}
.learn p{font-size:16.5px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.ans.long.txt{align-items:flex-start}
.ans.long.txt b{font-family:var(--body);font-size:16px;font-weight:700;text-align:left}
.ans.right{border-color:var(--good);background:#123a2e}
.ans.wrong{border-color:var(--bad);background:#3d1624}
.ans:disabled{cursor:default}
.opt.sm button{padding:8px 12px;font-size:14px}
.nav2{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.mb{display:block;width:100%;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.mb i{display:block;height:100%;border-radius:99px}
.week.w14{grid-template-columns:repeat(14,1fr);gap:3px}
.week.w14 div{font-size:9px}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.stepn{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.stepn.done{background:var(--good);color:#06291a}
.rgw{display:grid;gap:4px;width:100%}
.rg{width:100%;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.rgc{height:32px;border-radius:8px;background:var(--surface2);font-size:11px;color:var(--muted);display:grid;place-items:center;font-weight:700}
.rgc.h{background:var(--d2);color:#2b1700}
.rgc.cur{outline:2px solid #fff;outline-offset:1px}
.ans.rgans{padding:12px}
.vis{display:grid;gap:6px;padding:10px;border-radius:14px;background:rgba(255,255,255,.06)}
.lad{position:relative;display:flex;align-items:flex-end;gap:4px;height:124px;padding-top:20px}
.rung{flex:1;border-radius:8px 8px 4px 4px;background:var(--c);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-weight:800;color:#12142a;border:2px solid var(--c);font-size:14px;position:relative}
.rung.un{background:transparent;color:var(--fg);border-style:dashed;opacity:.8}
.rung.me{outline:3px solid var(--good);outline-offset:1px;opacity:1}
.rung.you{outline:3px solid var(--bad);outline-offset:1px;opacity:1}
.ball{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:left .32s ease,bottom .32s ease;pointer-events:none;z-index:2}
.fmap{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:4px;align-items:stretch;text-align:center}
.fz{border-radius:12px;background:var(--surface2);padding:8px 4px;display:grid;gap:6px;align-content:start;animation:zone 6s infinite}
.fz:nth-child(3){animation-delay:2s}.fz:nth-child(5){animation-delay:4s}
.fz b{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.fz span.c{display:inline-block;padding:3px 8px;border-radius:99px;background:var(--surface);font-weight:800}
.fz span.c.ok{outline:2px solid var(--good)}.fz span.c.ko{outline:2px solid var(--bad)}
.farr{align-self:center;color:var(--muted);font-weight:800}
@keyframes zone{0%,100%{box-shadow:none}10%,30%{box-shadow:0 0 0 2px var(--gold)}}
.cont polyline{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cont .g{stroke:var(--good);stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease forwards}
.cont .r{stroke:var(--bad);stroke-dasharray:4 4;opacity:.9}
@keyframes draw{to{stroke-dashoffset:0}}
.tri{position:relative;height:86px;width:60%;margin:0 auto}
.tri i{position:absolute;left:0;right:0;height:10px;border-radius:6px;background:var(--d5)}
.tri i.r{bottom:0;background:var(--d1)}.tri i.f{bottom:50px;background:var(--d5)}
.tri i.t{bottom:34px;background:var(--d3);animation:third 4s ease-in-out infinite}
@keyframes third{0%,35%{bottom:40px}50%,85%{bottom:30px}100%{bottom:40px}}
@media (prefers-reduced-motion:reduce){.fz,.tri i.t,.cont .g{animation:none}.cont .g{stroke-dashoffset:0}}
.aidefab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.aide{position:fixed;inset:0;z-index:45;display:flex;justify-content:center;align-items:flex-end;background:rgba(5,6,16,.6)}
.aide .in{width:100%;max-width:560px;height:82vh;background:var(--surface);border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));gap:10px}
.aide .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.aide .m{padding:10px 12px;border-radius:14px;font-size:15px;white-space:pre-wrap;max-width:92%}
.aide .m.u{align-self:flex-end;background:var(--accent);color:#1a0d06}
.aide .m.a{align-self:flex-start;background:var(--surface2)}
.aide .sug{display:flex;flex-wrap:wrap;gap:6px}
.aide .sug button{padding:8px 12px;border-radius:99px;background:var(--surface2);font-size:13.5px;font-weight:700}
.aide form{display:flex;gap:8px}
.aide textarea{flex:1;resize:none;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:10px 12px}
.aide form button{padding:0 16px;border-radius:14px;background:var(--accent);color:#1a0d06;font-weight:800}
.midok{outline:3px solid var(--good)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
/* ===================== DONNÉES MUSICALES ===================== */
const SCALE=[0,2,4,5,7,9,11];
const QUAL=['M','m','m','M','M','m','d'];
const ROM=['I','ii','iii','IV','V','vi','vii°'];
const FR={C:'Do',D:'Ré',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
const KEYS=[
 {id:'C',semi:0,notes:['C','D','E','F','G','A','B']},
 {id:'G',semi:7,notes:['G','A','B','C','D','E','F#']},
 {id:'F',semi:5,notes:['F','G','A','Bb','C','D','E']},
 {id:'D',semi:2,notes:['D','E','F#','G','A','B','C#']},
 {id:'Bb',semi:10,notes:['Bb','C','D','Eb','F','G','A']},

const U_R={id:'ur',title:'Le rythme',goal:'Rythme',col:'#ffa94d',desc:'Jouer les bonnes notes ne suffit pas : il faut les placer dans le temps.',L:[
 {id:'r1',type:'learn',t:'La pulsation et les « et »',pages:[
  {t:'La pulsation',h:`Sous chaque chanson, il y a une pulsation régulière : le « tic-tac » sur lequel tu tapes du pied. On la compte <b>1 – 2 – 3 – 4</b>, puis on recommence. C'est le squelette du rythme.`,rgs:[{l:'Quatre temps frappés',p:[1,0,1,0,1,0,1,0]}],demos:[{l:'Écouter la pulsation',run:()=>playPat([1,0,1,0,1,0,1,0])}]},
  {t:'Les « et »',h:`Entre deux temps, on peut placer un coup de plus : le <b>« et »</b>. On compte alors <b>1 et 2 et 3 et 4 et</b>. Un coup sur un « et » s'appelle un contretemps. Dans l'app, il est noté +.`,rgs:[{l:'Tous les temps et tous les « et »',p:[1,1,1,1,1,1,1,1]},{l:'Seulement les « et »',p:[0,1,0,1,0,1,0,1]}],demos:[{l:'Écouter tout',run:()=>playPat([1,1,1,1,1,1,1,1])},{l:'Écouter les « et » seuls',run:()=>playPat([0,1,0,1,0,1,0,1])}]},
  {t:'Lire une grille rythmique',h:`Dans l'app, un rythme s'affiche en <b>8 cases</b> : 1 + 2 + 3 + 4 +. Case orange : tu joues. Case grise : silence. Tu entends d'abord 4 clics pour donner le tempo, puis le rythme, deux fois.`,rgs:[{p:[1,0,1,1,0,1,1,1]}],demos:[{l:'Écouter ce rythme',run:()=>playPat([1,0,1,1,0,1,1,1])}],tip:`Tape du pied sur chaque temps pendant que tu écoutes : tu verras tomber les coups.`}],
  qs:[
   {q:`Combien de temps compte une mesure habituelle de chanson pop ?`,o:[`4`,`2`,`7`,`12`],w:`La plupart des chansons pop comptent 4 temps par mesure : 1 – 2 – 3 – 4.`},
   {q:`Qu'est-ce que la pulsation ?`,o:[`Le tic-tac régulier sur lequel on tape du pied`,`La mélodie de la chanson`,`La note la plus grave`,`La vitesse de la voix`],w:`La pulsation est le battement régulier. Tous les rythmes se placent dessus.`},
   {q:`Qu'est-ce qu'un contretemps ?`,o:[`Un coup placé sur un « et », entre deux temps`,`Un silence de quatre temps`,`Un coup plus fort que les autres`,`Un accord mineur`],w:`Un contretemps tombe entre deux temps : sur le « et ». C'est lui qui donne du mouvement.`},
   {q:`Dans l'app, que représentent les 8 cases d'un rythme ?`,o:[`Une mesure : 1 + 2 + 3 + 4 +`,`Huit notes différentes`,`Huit accords`,`Huit secondes`],w:`Chaque case est un demi-temps : les temps (1, 2, 3, 4) et les « et » (+) entre eux.`}]},
 {id:'r2',type:'rhy',t:'La pulsation : quels temps ?',pats:PAT.q,intro:`Un rythme se place sur une pulsation régulière. Ici, seuls les temps 1, 2, 3 et 4 peuvent être frappés. Tape du pied et repère les temps où il y a un coup.`,tip:`Compte 1-2-3-4 dans ta tête : un temps sans coup est un silence.`},
 {id:'r3',type:'rhy',t:'Les croches : temps et « et »',pats:PAT.e,intro:`Maintenant, des coups peuvent aussi tomber sur les « et ». Compte 1 et 2 et 3 et 4 et, et repère où tombent les coups.`,tip:`Un coup qui tombe entre deux battements de pied, c'est un « et ».`},
 {id:'r4',type:'learn',t:'Syncopes et motifs',pages:[
  {t:'La syncope',h:`Une <b>syncope</b> : on joue un « et » et on ne rejoue pas le temps qui suit. L'accent tombe à contretemps, ce qui donne du mouvement. Voici un motif : coups sur 1, sur le « et » du 2, et sur 4.`,rgs:[{p:[1,0,0,1,0,0,1,0]}],demos:[{l:'Écouter ce motif',run:()=>playPat([1,0,0,1,0,0,1,0])}]},
  {t:`Les motifs d'accompagnement`,h:`Pour t'accompagner, tu répètes un motif simple sur tes accords : par exemple <b>1, 2, « et » du 2, « et » du 3, 4, « et » du 4</b>. Le même motif tourne sur toute la chanson : seul l'accord change.`,rgs:[{p:[1,0,1,1,0,1,1,1]}],demos:[{l:`Écouter sur l'accord de {C}`,run:()=>playPat([1,0,1,1,0,1,1,1],chA(KEYS[0],1))}]},
  {t:`Jouer l'accord en rythme`,h:`Tu peux jouer l'accord entier à chaque coup du motif, ou la basse sur les temps forts et l'accord sur les autres. Commence lentement, en tapant du pied sur chaque temps, puis accélère.`,rgs:[{p:[1,0,0,1,1,0,1,0]}],demos:[{l:`Écouter sur l'accord de {C}`,run:()=>playPat([1,0,0,1,1,0,1,0],chA(KEYS[0],1))}]}],
  qs:[
   {q:`Qu'est-ce qu'une syncope ?`,o:[`Un coup sur un « et » sans rejouer le temps suivant`,`Un silence entre deux accords`,`Un accord joué plus fort`,`Un changement de tonalité`],w:`La syncope déplace l'accent sur un contretemps : on entend un coup « à côté » du temps attendu.`},
   {q:`Que fait-on d'un motif d'accompagnement ?`,o:[`On le répète sur toute la chanson, l'accord change`,`On le change à chaque mesure`,`On le joue une seule fois`,`On le chante`],w:`Le motif reste le même. Tu changes seulement l'accord dessus : c'est ce qui fait tenir une chanson.`},
   {q:`Comment bien apprendre un motif rythmique ?`,o:[`Lentement, en tapant du pied sur chaque temps`,`Le plus vite possible`,`Sans écouter la pulsation`,`En regardant ses mains seulement`],w:`La pulsation d'abord, la vitesse ensuite. Ton pied garde le tempo, tes mains placent les coups.`}]},
 {id:'r5',type:'rhy',t:'Syncopes',pats:PAT.s,intro:`Des rythmes qui évitent certains temps et tombent sur des « et » : les syncopes. C'est ce qui rend un rythme « groovy ».`,tip:`Repère d'abord s'il y a un coup sur le 1, puis place les « et ».`},
 {id:'r6',type:'rhy',t:`Motifs d'accompagnement`,pats:PAT.m,intro:`Des motifs qu'on trouve vraiment en accompagnement de chansons : mélange de temps, de « et » et de silences.`,tip:`Écoute deux fois : la première pour le tempo, la seconde pour repérer les coups.`},
 {id:'r7',type:'kb',t:'Au clavier : un accord en rythme',intro:`Joue un accord en suivant un motif rythmique, en tapant du pied sur chaque temps.`,steps:[`Choisis un accord ci-dessous : les trois touches s'allument.`,`Joue-le sur le motif affiché : orange = tu joues, gris = silence. Compte 1 + 2 + 3 + 4 + à voix haute.`,`Reste sur le même accord pendant 8 mesures, puis passe à l'accord suivant sans arrêter le motif.`],pick:true,sel:SELCH([1,4,5,6]),kb:(k,s)=>chordHL(k,s),rgs:[{l:'Motif à jouer',p:[1,0,1,1,0,1,1,1]}],demos:[{l:'Écouter le motif avec cet accord',run:(k,s)=>playPat([1,0,1,1,0,1,1,1],chA(k,s))}],hint:`Commence très lentement. Si tu perds le tempo, joue seulement les 4 temps (1-2-3-4), puis ajoute les « et ».`}]};

 {id:'mk',type:'kb',t:'Au clavier : le mode mineur',intro:`Joue en mineur : la gamme, puis la grille i – VI – III – VII.`,steps:[`Choisis une tonalité mineure ({A} mineur pour commencer, que des touches blanches). Joue la gamme de {A} à {A}.`,`Joue chaque accord de la grille i – VI – III – VII avec trois doigts, deux temps chacun.`,`Chante la note de basse de chaque accord.`],keys:MKEYS,pick:true,sel:SELCHM([1,6,3,7]),kb:(k,s)=>chordHL(k,s),demos:[dScale('Écouter la gamme'),{l:'Écouter la grille i – VI – III – VII',run:k=>playSeqM([1,6,3,7].map(d=>chA(k,d)),1.1)}],hint:`{A} mineur n'utilise que des touches blanches : c'est la gamme de {C} majeur, jouée à partir du {A}.`}]};
const U_P={id:'up',title:'Les accords de la pop',goal:'Accompagnement',col:'#ff8787',desc:'Deux accords « empruntés » que l’on entend partout : le ♭VII et le V7.',L:[
 {id:'p1',type:'learn',t:'Le ♭VII et le V7',pages:[
  {t:`Le ♭VII, l'accord rock`,pick:true,h:k=>`Parfois, on emprunte un accord majeur construit un ton sous la maison : le <b>♭VII</b>. En ${keyName(k)}, c'est <b>${chordName(k,8)}</b>. Il sonne ouvert, un peu rebelle. Une grille classique : <b>I – ♭VII – IV – I</b>.`,kb:k=>chordHLX(k,8),demos:[{l:'Écouter le ♭VII',run:k=>playSeqM([chA(k,8)],1.4)},dChords('I – ♭VII – IV – I',[1,8,4,1],1.1)]},
  {t:'Le V7',pick:true,sel:[{v:5,l:'V'},{v:9,l:'V7'}],h:(k,s)=>`On peut ajouter au V une 4e note, une 7e : c'est le <b>V7</b>. En ${keyName(k)} : <b>${chordName(k,9)}</b>. Il tire encore plus fort vers le I. On l'entend beaucoup dans le blues et le jazz.`,kb:(k,s)=>s===9?chordHLX(k,9):chordHL(k,5),demos:[dChords('V → I',[5,1],1.2),dChords('V7 → I',[9,1],1.2)]},
  {t:'Les entendre',pick:true,h:`Compare : le <b>♭VII</b> ajoute une couleur rock, le <b>V7</b> ajoute de la tension. Ils ne changent pas le rôle du I (la maison), du IV (on s'éloigne) ou du V (la tension) : ils les colorent.`,demos:[dChords('I – ♭VII – IV – I',[1,8,4,1],1.1),dChords('I – IV – V7 – I',[1,4,9,1],1.1),dChords('I – IV – V – I',[1,4,5,1],1.1)]}],
  qs:[
   {q:`En {C} majeur, quel est le ♭VII ?`,o:[`{Bb} majeur`,`{B} majeur`,`{A}m`,`{F}`],w:`Un ton sous la maison : {Bb} majeur. Le « ♭ » veut dire que le 7e degré est abaissé d'un demi-ton.`},
   {q:`Quel accord tire le plus fort vers le I ?`,o:[`Le V7`,`Le IV`,`Le vi`,`Le ♭VII`],w:`Le V7 : au V s'ajoute une note de plus qui augmente la tension.`},
   {q:`La grille I – ♭VII – IV – I sonne plutôt…`,o:[`Rock, ouverte`,`Triste, sombre`,`Comme une valse`,`Dissonante`],w:`Le ♭VII est majeur et lumineux : la grille sonne ouverte, façon rock.`},
   {q:`Qu'est-ce qui distingue le V7 du V ?`,o:[`Une 4e note (la 7e)`,`Il est mineur`,`Il est plus grave`,`Il est plus rapide`],w:`Le V7 ajoute une 7e au V. Par exemple {G}7 = {G} – {B} – {D} – {F}.`}]},
 {id:'p2',type:'chord',keys:'all',set:[1,4,5,8],t:'Le ♭VII dans les accords',intro:`Le <b>♭VII</b> rejoint le I, le IV et le V. Il est majeur et lumineux, un ton sous la maison : écoute sa basse.`,tip:`Si la basse est juste sous le 1, c'est probablement le ♭VII.`},
 {id:'p3',type:'prog',keys:'all',len:4,set:[1,4,5,8],t:'Grilles avec ♭VII',intro:`Des grilles de 4 accords avec le ♭VII, comme I – ♭VII – IV – I.`,tip:`Repère d'abord où tombe le ♭VII, souvent juste après la maison.`},
 {id:'p4',type:'chord',keys:'all',set:[1,4,5,9],t:'V ou V7 ?',intro:`Distingue le <b>V</b> du <b>V7</b> : le V7 est plus tendu, avec une petite dissonance qui réclame le I.`,tip:`Si ça « gratte » un peu et appelle le I avec insistance, c'est le V7.`},
 {id:'p5',type:'kb',t:'Au clavier : I – ♭VII – IV',intro:`Joue la grille d'un grand classique rock : I – ♭VII – IV.`,steps:[`Choisis ta tonalité. Joue chaque accord avec trois doigts : I, ♭VII, IV, puis retour au I.`,`Joue chaque accord deux temps, en boucle, sur un motif de ton choix.`,`Chante une note de la mélodie par-dessus.`],pick:true,sel:[{v:1,l:'I'},{v:8,l:'♭VII'},{v:4,l:'IV'}],kb:(k,s)=>s===8?chordHLX(k,8):chordHL(k,s),demos:[dChords('Écouter I – ♭VII – IV – I',[1,8,4,1],1.1)],hint:`Le ♭VII est un ton sous la maison : un seul doigt à déplacer par rapport au IV, deux par rapport au I.`}]};

const U=[
 {id:'u0',title:'Les bases',goal:'Comprendre',col:'var(--d3)',desc:'Le clavier, la gamme majeure et les degrés. Trois leçons courtes, puis ton premier défi au clavier.',L:[
  {id:'b1',type:'learn',t:'Le clavier et les 12 notes',pages:[
   {t:'Les touches se répètent',h:`Regarde les touches noires : elles vont par groupes de 2 et de 3. Le <b>{C}</b> est la touche blanche juste avant un groupe de 2 touches noires. Touche les notes pour les entendre.`,kb:()=>({60:{d:1,l:'',n:fmt('C')},72:{d:1,l:'',n:fmt('C')}}),kbopt:{from:60,to:72,names:true},demos:[dMidis('Écouter les touches blanches',[60,62,64,65,67,69,71,72],.4)]},
   {t:"Il n'y a que 12 notes",h:`En tout : <b>12 notes</b>, soit 7 touches blanches ({C} {D} {E} {F} {G} {A} {B}) et 5 noires (les dièses ♯ et les bémols ♭). Après le {B}, on retombe sur le {C} : la même note, en plus aigu. On appelle ça une <b>octave</b>.`,kb:()=>({}),kbopt:{from:60,to:72,names:true},demos:[dMidis('Écouter les 12 notes',Array.from({length:13},(_,i)=>60+i),.22)]},
   {t:'Demi-ton et ton',h:`Le plus petit écart entre deux notes est le <b>demi-ton</b> : deux touches voisines, noires ou blanches. Deux demi-tons font un <b>ton</b>. Entre {E} et {F}, et entre {B} et {C}, il n'y a pas de touche noire : ce sont des demi-tons.`,kb:()=>({64:{d:2,l:'½',n:fmt('E')},65:{d:2,l:'½',n:fmt('F')},71:{d:6,l:'½',n:fmt('B')},72:{d:6,l:'½',n:fmt('C')}}),kbopt:{from:60,to:72,names:true},demos:[dMidis('{E} → {F} : un demi-ton',[64,65],.7),dMidis('{C} → {D} : un ton',[60,62],.7),dMidis('{B} → {C} : un demi-ton',[71,72],.7)]}],
   qs:[
    {q:`Quelle touche blanche précède toujours un groupe de 2 touches noires ?`,o:[`{C}`,`{D}`,`{F}`,`{G}`],w:`Le {C} : le groupe de 2 touches noires ({C}♯ et {D}♯) commence juste après lui. Le {F} précède, lui, le groupe de 3.`},
    {q:`Combien de notes différentes y a-t-il avant de retomber sur la même note, plus aiguë ?`,o:[`12`,`7`,`8`,`5`],w:`12 : 7 touches blanches et 5 noires. La 13e est la même note en plus aigu : c'est l'octave.`},
    {q:`Entre quelles notes y a-t-il un demi-ton, sans touche noire entre elles ?`,o:[`{E} et {F}`,`{C} et {D}`,`{F} et {G}`,`{A} et {B}`],w:`{E} et {F} se touchent : c'est un demi-ton. C'est pareil pour {B} et {C}. Ailleurs sur les touches blanches, une touche noire s'intercale : l'écart est d'un ton.`},
    {q:`Combien de demi-tons y a-t-il dans un ton ?`,o:[`2`,`1`,`3`,`12`],w:`Un ton = deux demi-tons. Par exemple de {C} à {D}, en passant par la touche noire.`}]},
  {id:'b2',type:'learn',t:'La gamme majeure',pages:[
   {t:'La formule',h:`Une <b>gamme</b> est une suite de 7 notes qui se termine sur la note de départ, plus aiguë. La gamme majeure suit toujours le même schéma d'écarts : <b>ton, ton, demi-ton, ton, ton, ton, demi-ton</b>. En partant du {C}, il suffit de jouer les touches blanches.`,kb:()=>scaleHL(KEYS[0]),demos:[dScale('Écouter la gamme de {C} majeur')]},
   {t:'Où sont les demi-tons',h:`Les deux demi-tons sont entre le <b>3 et le 4</b>, et entre le <b>7 et le 8</b> (le 1 du haut). Partout ailleurs, l'écart est d'un ton. Ce sont ces deux endroits qui donnent à la gamme sa forme.`,kb:()=>scaleHL(KEYS[0]),demos:[dDegs('1 → 2 : un ton',[1,2],.7),dDegs('3 → 4 : un demi-ton',[3,4],.7),dDegs('7 → 1 : un demi-ton',[7,8],.7)]},
   {t:'La même formule, partout',pick:true,h:(k)=>`Pars de n'importe quelle note et applique la formule : tu obtiens la gamme majeure de cette note. Choisis ta note de départ : <b>${keyName(k)}</b> = ${k.notes.map(fmt).join(' – ')}. Selon la note de départ, des touches noires s'ajoutent pour respecter la formule.`,kb:k=>scaleHL(k),demos:[dScale()],tip:`Tu n'as pas besoin d'apprendre les 12 gammes. On en verra 8 plus tard : ce sont les plus utiles.`}],
   qs:[
    {q:`Quelle est la formule de la gamme majeure ?`,o:[`ton, ton, demi-ton, ton, ton, ton, demi-ton`,`ton, demi-ton, ton, ton, demi-ton, ton, ton`,`demi-ton, ton, ton, ton, demi-ton, ton, ton`,`ton, ton, ton, demi-ton, ton, ton, demi-ton`],w:`Ton, ton, demi-ton, ton, ton, ton, demi-ton. Une astuce : les demi-tons tombent entre 3-4 et 7-8.`},
    {q:`Où se trouvent les demi-tons dans la gamme majeure ?`,o:[`Entre 3-4 et entre 7-8`,`Entre 1-2 et entre 5-6`,`Entre 2-3 et entre 6-7`,`Entre 4-5 et entre 7-8`],w:`Entre le 3 et le 4, et entre le 7 et le 8. En {C} majeur, ce sont les paires {E}–{F} et {B}–{C}.`},
    {q:`Combien de notes différentes contient une gamme majeure ?`,o:[`7`,`8`,`12`,`5`],w:`7 notes, numérotées de 1 à 7. Le « 8 » est le 1 qui revient, une octave plus haut.`},
    {q:`En {C} majeur, quelle note est le degré 5 ?`,o:[`{G}`,`{F}`,`{A}`,`{E}`],w:`{C}=1, {D}=2, {E}=3, {F}=4, {G}=5.`}]},
  {id:'b3',type:'learn',t:'Penser en degrés',pages:[
   {t:'Chaque note a un numéro',h:`On numérote les 7 notes de la gamme de 1 à 7. Le <b>1</b> est la note de départ : la <b>note maison</b> (la tonique). On parle de <b>degrés</b>. C'est avec ces numéros que tu vas penser la musique.`,kb:()=>scaleHL(KEYS[0]),demos:[dScale()]},
   {t:'Les numéros ne bougent pas',pick:true,h:(k)=>`En ${keyName(k)}, le 1 est ${fmt(k.notes[0])} et le 5 est ${fmt(k.notes[4])}. Dans une autre tonalité, le 5 est une autre note, mais il joue le même rôle. Change de tonalité : les numéros restent, les notes changent.`,kb:k=>scaleHL(k),demos:[dScale(),dDegs('Écouter 1 – 3 – 5',[1,3,5],.6)]},
   {t:'Pourquoi c\'est utile',pick:true,h:`Une chanson jouée en {C} ou en {G} est la même chanson : les degrés sont identiques. Si tu reconnais les degrés à l'oreille, tu peux jouer une mélodie dans n'importe quelle tonalité. Écoute ce petit motif 1 – 2 – 3 – 1 dans la tonalité de ton choix.`,kb:k=>degsHL(k,[1,2,3]),demos:[dDegs('Écouter le motif 1-2-3-1',[1,2,3,1],.5)],tip:`Pour chanter dans ta voix, tu changes seulement la note maison. Rien d'autre.`}],
   qs:[
    {q:`En {G} majeur ({G} {A} {B} {C} {D} {E} {F#}), quelle note est le degré 5 ?`,o:[`{D}`,`{C}`,`{E}`,`{B}`],w:`On compte à partir de la note maison : {G}=1, {A}=2, {B}=3, {C}=4, {D}=5.`},
    {q:`Une chanson passe de {C} majeur à {G} majeur. Qu'est-ce qui change ?`,o:[`Les notes jouées, mais pas les degrés`,`Les degrés, mais pas les notes`,`Tout change`,`Rien du tout`],w:`Seule la note maison change de place. Les degrés (la mélodie vue en numéros) et les accords (I, IV, V…) restent les mêmes.`},
    {q:`Comment s'appelle le degré 1, la note de départ de la gamme ?`,o:[`La tonique, ou « note maison »`,`La dominante`,`L'octave`,`La sensible`],w:`Le 1 est la tonique : la note où la musique se sent chez elle. Le 5 est la dominante et le 7 la sensible.`},
    {q:`En {F} majeur ({F} {G} {A} {Bb} {C} {D} {E}), quel est le degré 3 ?`,o:[`{A}`,`{G}`,`{C}`,`{Bb}`],w:`{F}=1, {G}=2, {A}=3.`}]},
  {id:'b4',type:'kb',t:'Au clavier : la gamme majeure',intro:`Joue la gamme de {C} majeur avec la main droite, en montant puis en descendant.`,steps:[`Pose le pouce sur le {C}, juste avant le groupe de 2 touches noires.`,`Monte note par note : {C} {D} {E} {F} {G} {A} {B} {C}. Doigts : 1-2-3, le pouce passe sous la main, puis 1-2-3-4-5.`,`Redescends. Dis les degrés à voix haute en jouant : 1 2 3 4 5 6 7 1.`],kb:()=>scaleHL(KEYS[0]),demos:[dScale('Écouter le modèle')],hint:`Les touches allumées sont les bonnes. Entre {E} et {F}, et entre {B} et {C}, il n'y a pas de touche noire : c'est là que se trouvent les demi-tons.`}]},
 {id:'u1',title:'La maison',goal:'Mélodie',col:'var(--d1)',desc:'Reconnaître les notes essentielles (1, 5, 3, 2) par rapport à la note maison. La tonalité change à chaque question : tu reconnais le rôle de la note, pas sa hauteur.',L:[
  {id:'1a',t:'Le 1 et le 5',type:'deg',keys:'all',set:[1,5],intro:`Chaque question commence par 4 accords, la <b>cadence</b>. Elle installe la tonalité : la « maison ». Ensuite, une note sonne.<br><br>La tonalité change à chaque question : tu ne peux donc pas retenir le son d'une note, il faut sentir sa place par rapport à la maison.<br><br><b>Le 1</b>, c'est la maison : tout est posé. <b>Le 5</b> est stable aussi, mais plus « en l'air ».`,tip:`Après chaque bonne réponse, écoute la note rentrer à la maison et chante-la.`},
  {id:'1b',t:"Les notes de l'accord maison",type:'deg',keys:'all',set:[1,3,5],intro:`1, 3 et 5 forment l'accord du I. Ce sont les <b>notes stables</b> (Hooktheory 3.3). Le 3 apporte la couleur joyeuse du majeur.`,tip:`Si la note semble « posée », c'est l'une des trois. Reste à sentir laquelle.`},
  {id:'1c',t:'Le 2, la note en suspens',type:'deg',keys:'all',set:[1,2,3,5],intro:`Le 2 est la première note <b>instable</b> : il n'est pas dans l'accord de la maison et veut redescendre au 1.`,tip:`Une note qui « pose une question » et veut descendre d'un pas, c'est souvent le 2.`},
  {id:'1d',opt:true,t:'Le 4, la note qui pèse',type:'deg',keys:'all',set:[1,2,3,4,5],intro:`Le 4 tire vers le 3 juste en dessous. Avec lui, tu connais la première moitié de la gamme : 1 2 3 4 5.`,tip:`Chante le chemin vers le 1 en comptant les marches : 4 → 3 → 2 → 1.`},
  {id:'1e',opt:true,t:'Le 6, la note tendre',type:'deg',keys:'all',set:[1,2,3,4,5,6],intro:`Le 6 a une couleur nostalgique. Les notes au-dessus du 5 <b>montent</b> vers le 1 du haut : 6 → 7 → 1.`,tip:`Les notes 2, 3, 4 redescendent vers le 1. Les notes 5, 6, 7 montent vers le 1 du haut.`},
  {id:'1f',opt:true,t:'Le 7, la sensible',type:'deg',keys:'all',set:[1,2,3,4,5,6,7],intro:`Le 7 est collé sous le 1 et veut absolument y monter. Avec lui, tu as toute la gamme majeure.`,tip:`Si la note « tire » très fort vers le haut, c'est le 7.`},
  {id:'rp',type:'learn',t:'Un air connu pour chaque note',pages:[
   {t:'Une chanson pour chaque degré',pick:true,sel:[1,2,3,4,5,6,7,8].map(d=>({v:d,l:d===8?'Octave':String(d)})),h:(k,s)=>`Pour reconnaître une note, accroche-la à un air que tu connais par cœur. Pour <b>${s===8?'l\'octave':'le '+s}</b> : <b>« ${REP[s].s} »</b>. ${repHow(s)} Notes jouées : ${REP[s].d.map(d=>fmt(k.notes[(d-1)%7])).join(' – ')}.`,kb:(k,s)=>degsHL(k,[...new Set(REP[s].d)]),demos:[{l:'Écouter le début de l\'air',run:(k,s)=>playSeqM(REP[s].d.map(d=>degMidi(k,d)),.5)},{l:'Avec la cadence',run:(k,s)=>playRep(k,s,true)}],tip:'Ce sont seulement les premières notes : chante-les dans ta tête avant de répondre.'},
   {t:'Comment t\'en servir',h:`Méthode : (1) écoute la cadence et garde la maison en tête ; (2) écoute la note mystère ; (3) chante l'air de ton choix en partant de la maison : si la note mystère tombe au bon moment dans l'air, tu as trouvé son degré. Ça marche dans toutes les tonalités, car l'air est toujours construit sur les mêmes degrés. Ce n'est qu'une béquille : avec la pratique, tu reconnaîtras la sensation sans l'air.`}],
  qs:[
   {q:'Par quelle note commence « Ode à la joie » ?',o:['Le 3','Le 1','Le 5','Le 7'],w:'« Ode à la joie » démarre sur le 3, répété, puis monte au 4 et au 5.'},
   {q:'Dans le début de « Joyeux anniversaire », la dernière note est…',o:['Le 7, qui veut monter au 1','Le 1','Le 5','Le 3'],w:'La ligne finit sur le 7 : une note instable, qui attend le 1.'},
   {q:'Quel point commun entre « Au clair de la lune » et « Frère Jacques » ?',o:['Ils commencent par la note maison (1)','Ils commencent par le 5','Ils commencent par le 7','Ils sont en mineur'],w:'Les deux démarrent sur le 1 : la maison.'},
   {q:'Comment s\'appelle le saut du 1 au 1 plus aigu, comme au début d\'« Over the Rainbow » ?',o:['Une octave','Un demi-ton','Un accord','Une gamme'],w:'Une octave : la même note, en plus aigu.'}]},
  {id:'1g',opt:true,t:'Sur deux octaves',type:'deg',keys:'all',set:[1,2,3,4,5,6,7],wide:true,intro:`Même gamme, mais les notes peuvent être plus graves ou plus aiguës. Un 3 reste un 3, quelle que soit sa hauteur.`,tip:`Ne cherche pas la hauteur : cherche la « personnalité » de la note.`},
  {id:'1h',type:'kb',t:'Au clavier : 1 – 3 – 5',intro:`Passe de l'oreille aux doigts : joue les trois notes stables de la maison.`,steps:[`Joue le 1, le 3, le 5, puis redescends : 1-3-5-3-1. Chante chaque note en la jouant.`,`Ferme les yeux, joue la note maison (1) et chante le 5 dans ta tête. Rouvre les yeux et vérifie en jouant le 5.`,`Change de tonalité avec les boutons et refais 1-3-5-3-1.`],pick:true,kb:k=>degsHL(k,[1,3,5]),demos:[dDegs('Écouter 1-3-5-3-1',[1,3,5,3,1],.6)],hint:`Ces trois notes forment l'accord de la maison : elles sonnent toujours bien ensemble.`}]},
 {id:'u2',title:'Les accords qui accompagnent',goal:'Accompagnement',col:'var(--d5)',desc:'Entendre les accords que tes mains joueront sous ta voix.',L:[
    {id:'c1',type:'learn',t:'Construire un accord',pages:[
   {t:'Un accord, ce sont 3 notes',h:`Un accord simple empile trois notes de la gamme en sautant une note à chaque fois : le <b>1</b>, le <b>3</b> et le <b>5</b>. En {C} majeur : {C}, {E}, {G}. Joue les trois touches ensemble : c'est l'accord de {C} majeur.`,kb:()=>chordHL(KEYS[0],1),demos:[dMidis('Les 3 notes une par une',[60,64,67],.6),dMidis('Les 3 ensemble',[[48,60,64,67]],1.4)]},
   {t:'Majeur ou mineur ?',h:`Le <b>3</b> décide de la couleur. À 4 demi-tons du 1, l'accord est <b>majeur</b> : lumineux. À 3 demi-tons, il est <b>mineur</b> : plus sombre. Le 1 et le 5 ne bougent pas.`,sel:[{v:'M',l:'Majeur'},{v:'m',l:'Mineur'}],kb:(k,s)=>({60:{d:1,l:1,n:fmt('C')},[s==='M'?64:63]:{d:3,l:3,n:s==='M'?fmt('E'):fmt('Eb')},67:{d:5,l:5,n:fmt('G')}}),demos:[{l:`Écouter l'accord`,run:(k,s)=>playSeqM([[48,60,s==='M'?64:63,67]],1.4)}],tip:`On note un accord mineur avec un « m » : {A}m = {A} mineur.`}],
   qs:[
    {q:`Quelles notes forment l'accord de {C} majeur ?`,o:[`{C} – {E} – {G}`,`{C} – {D} – {E}`,`{C} – {F} – {A}`,`{C} – {E} – {A}`],w:`Le 1, le 3 et le 5 de la gamme de {C} : {C}, {E}, {G}.`},
    {q:`Quelle note change entre un accord majeur et un accord mineur ?`,o:[`Le 3, un demi-ton plus bas en mineur`,`Le 1`,`Le 5`,`Aucune, c'est le rythme qui change`],w:`Seul le 3 bouge : {C}–{E}–{G} (majeur) devient {C}–{Eb}–{G} (mineur).`},
    {q:`{A} mineur se joue {A} – {C} – {E}. Quel est l'écart entre {A} et {C} ?`,o:[`3 demi-tons`,`2 demi-tons`,`4 demi-tons`,`5 demi-tons`],w:`De {A} à {C} : {A}→{A#}→{B}→{C}, soit 3 demi-tons. C'est la signature d'un accord mineur.`}]},
  {id:'2a',t:'Majeur ou mineur ?',type:'qual',intro:`Un accord <b>majeur</b> sonne stable et lumineux. Un accord <b>mineur</b> sonne plus sombre, émouvant. Une seule note change : le 3 est un demi-ton plus bas.`,tip:`Demande-toi : joyeux ou triste ?`},
    {id:'c2',type:'learn',t:"Les accords d'une tonalité",pages:[
   {t:'Un accord sur chaque degré',pick:true,sel:SELCH([1,2,3,4,5,6,7]),h:(k,s)=>`On peut construire un accord sur chacun des 7 degrés, avec les seules notes de la gamme. On les note en chiffres romains : <b>I, ii, iii, IV, V, vi, vii°</b>. Choisis un degré. Ici : <b>${ROM[s-1]}</b> en ${keyName(k)} = <b>${chordName(k,s)}</b> (${chNotes(k,s)}).`,kb:(k,s)=>chordHL(k,s),demos:[{l:`Écouter cet accord`,run:(k,s)=>playSeqM([chA(k,s)],1.4)}],tip:`Le vii° est un accord à part, très rare en pop : tu peux l'ignorer.`},
   {t:'Majeurs et mineurs',pick:true,h:`Le schéma est le même dans toutes les tonalités : <b>I, IV, V</b> sont majeurs ; <b>ii, iii, vi</b> sont mineurs. Retiens surtout I, IV, V et vi : ce sont les accords de la pop. Écoute-les d'affilée.`,demos:[dChords('Écouter I – IV – V – vi',[1,4,5,6],1.1),dChords('Écouter ii – iii',[2,3],1.1)]},
   {t:'Le rôle de chaque accord',pick:true,h:`<b>I</b> : la maison, le repos. <b>IV</b> : on s'éloigne, ça s'ouvre. <b>V</b> : la tension, il veut retourner au I. <b>vi</b> : le mineur de la famille, plus émouvant. Une chanson est un trajet : on part de la maison, on s'éloigne, on crée de la tension, on revient.`,demos:[dChords('Écouter I → IV → V → I',[1,4,5,1],.9),dChords('Écouter V → I',[5,1],1.2)]}],
   qs:[
    {q:`Quels accords sont mineurs dans une tonalité majeure ?`,o:[`ii, iii et vi`,`I, IV et V`,`I, ii et V`,`IV, V et vi`],w:`ii, iii et vi sont mineurs. I, IV et V sont majeurs. Le schéma est identique dans toutes les tonalités.`},
    {q:`En {C} majeur, quel accord est le V ?`,o:[`{G}`,`{F}`,`{D}m`,`{A}m`],w:`{C}=1, {D}=2, {E}=3, {F}=4, {G}=5 : le V est l'accord construit sur le {G}.`},
    {q:`Quel accord est la maison, celui où l'on se sent chez soi ?`,o:[`Le I`,`Le IV`,`Le V`,`Le vi`],w:`Le I : il est construit sur la note maison. Le V crée la tension, le IV s'éloigne, le vi donne une couleur mineure.`},
    {q:`En {G} majeur ({G} {A} {B} {C} {D} {E} {F#}), quel accord est le vi ?`,o:[`{E}m`,`{C}`,`{D}`,`{A}m`],w:`Le vi est construit sur le degré 6, le {E}, et il est mineur : {E}m.`}]},
  {id:'2b',keys:'all',t:'La maison ou la tension ?',type:'chord',set:[1,5],intro:`Le <b>I</b> est la maison, le <b>V</b> la tension qui veut y revenir. Ce sont les deux accords les plus importants pour accompagner.`,tip:`Écoute la note la plus grave, la basse : elle donne le nom de l'accord.`},
  {id:'2c',keys:'all',t:'Les trois piliers',type:'chord',set:[1,4,5],intro:`I, IV et V : avec ces trois accords, tu peux accompagner des centaines de chansons. Le <b>IV</b> sonne comme un départ en douceur.`,tip:`IV « s'ouvre », V « attend ». Le I « se pose ».`},
  {id:'2d',keys:'all',t:'Les 4 accords de la pop',type:'chord',set:[1,4,5,6],intro:`On ajoute le <b>vi</b>, le seul mineur des quatre. I, IV, V et vi : le chapitre 2 de Hooktheory à l'oreille.`,tip:`Si c'est triste, c'est le vi. Sinon, cherche parmi I, IV et V.`},
  {id:'2e',type:'kb',t:'Au clavier : I – IV – V',intro:`Joue les accords principaux d'une tonalité, chacun avec trois doigts.`,steps:[`Choisis un accord ci-dessous : les trois touches s'allument. Pose-y trois doigts et joue-les ensemble.`,`Enchaîne I – IV – V – I, deux temps par accord.`,`Écoute la note la plus grave à chaque changement : c'est la basse, ce que tu apprends à reconnaître à l'oreille.`],pick:true,sel:SELCH([1,4,5,6]),kb:(k,s)=>chordHL(k,s),demos:[dChords('Écouter I – IV – V – I',[1,4,5,1],1)],hint:`Si les doigts se mélangent, joue d'abord la note de basse seule, puis ajoute les deux autres.`}]},
 {id:'u3',title:'Les enchaînements',goal:'Accompagnement',col:'var(--d4)',desc:"Suivre une grille d'accords, comme dans une vraie chanson.",L:[
  {id:'3a',keys:'all',t:'Deux accords',type:'prog',len:2,set:[1,4,5,6],intro:`Deux accords à la suite. Le premier est toujours le I : à toi de trouver le second.`,tip:`Note les accords dans l'ordre. Tu peux réécouter autant que tu veux.`},
    {id:'d1',type:'learn',t:'Pourquoi ces grilles marchent',pages:[
   {t:'La résolution V → I',pick:true,sel:SELCH([5,1]),h:`Le mouvement le plus fort en musique est <b>V → I</b> : la tension se relâche et on rentre à la maison. Écoute-le, puis écoute IV → I, plus doux.`,kb:(k,s)=>chordHL(k,s),demos:[dChords('Écouter V → I',[5,1],1.2),dChords('Écouter IV → I',[4,1],1.2)]},
   {t:'La grille I – V – vi – IV',pick:true,sel:SELCH([1,5,6,4]),h:`On part de la maison (I), on crée de la tension (V), on passe au mineur (vi), puis on s'ouvre (IV), ce qui ramène naturellement au I. La boucle ne s'arrête jamais, d'où l'effet « tube ». On la trouve dans « Let It Be » ou « Don't Stop Believin' ».`,kb:(k,s)=>chordHL(k,s),demos:[dChords('Écouter la grille',[1,5,6,4],1.1)]},
   {t:'Les autres grilles',pick:true,h:`<b>I – vi – IV – V</b> : la grille des années 50 (« Stand by Me »). <b>vi – IV – I – V</b> : les mêmes accords que la grille pop, mais en partant du mineur : plus mélancolique (« Zombie »). <b>I – IV – V – I</b> : la base du rock et du blues. Les mêmes accords dans un autre ordre changent l'émotion.`,demos:FAMOUS.map(f=>dChords(f.p.map(d=>ROM[d-1]).join(' – '),f.p,1))}],
   qs:[
    {q:`Quel mouvement donne la plus forte impression de retour à la maison ?`,o:[`V → I`,`IV → vi`,`I → IV`,`ii → iii`],w:`V → I : le V est la tension, le I la résolution. C'est le mouvement de base de presque toute la musique pop.`},
    {q:`Quelle est la grille pop la plus célèbre ?`,o:[`I – V – vi – IV`,`I – IV – V – I`,`vi – ii – iii – I`,`V – IV – iii – I`],w:`I – V – vi – IV, par exemple {C} – {G} – {A}m – {F} en {C} majeur.`},
    {q:`Pourquoi la grille pop peut-elle tourner en boucle sans lasser ?`,o:[`Elle finit sur le IV, qui ramène au I`,`Elle est très rapide`,`Elle est toujours en mineur`,`Elle n'a que deux accords`],w:`Le IV prépare le retour au I : la fin de la grille appelle le début, donc la boucle est naturelle.`},
    {q:`Une grille qui commence par le vi sonne plutôt…`,o:[`Mélancolique`,`Joyeuse`,`Comme une fanfare`,`Identique à une grille qui commence par le I`],w:`Le vi est mineur : commencer par lui donne une couleur plus triste, même avec les mêmes accords que la grille pop.`}]},
  {id:'3b',keys:'all',t:'Les grilles célèbres',type:'progid',intro:`Quatre grilles reviennent dans des milliers de chansons. Reconnais-les à leur couleur générale.`,tip:`Qui commence sur un accord triste ? C'est la version « mineure » de la grille pop.`},
  {id:'3c',keys:'all',t:'Trois accords',type:'prog',len:3,set:[1,4,5,6],intro:`Trois accords à retrouver, toujours en partant du I.`,tip:`Repère d'abord le vi (le mineur), puis départage I, IV et V.`},
  {id:'3d',keys:'all',t:'Une grille complète',type:'prog',len:4,set:[1,4,5,6],intro:`Quatre accords, comme une vraie grille de chanson. Elle ne commence pas toujours par le I.`,tip:`Si la grille te dit quelque chose, c'est sans doute une grille célèbre.`},
  {id:'v1',type:'learn',t:'Les renversements',pages:[
   {t:'Un même accord, plusieurs formes',sel:[{v:0,l:'Position de base'},{v:1,l:'1er renversement'},{v:2,l:'2e renversement'}],h:`Un accord peut se jouer avec ses notes dans un autre ordre : c'est un <b>renversement</b>. {C}–{E}–{G} (position de base), {E}–{G}–{C} (1er renversement), {G}–{C}–{E} (2e renversement). Les trois sont le même accord, avec la même couleur.`,kb:(k,s)=>{const b=[60,64,67];const r=b.slice(s).concat(b.slice(0,s).map(x=>x+12));const dg=[1,3,5];const dr=dg.slice(s).concat(dg.slice(0,s));const h={};r.forEach((m,i)=>{h[m]=hlOf(KEYS[0],dr[i])});return h},demos:[{l:'Écouter cette forme',run:(k,s)=>{const b=[60,64,67];const r=b.slice(s).concat(b.slice(0,s).map(x=>x+12));playSeqM([[48,...r]],1.4)}}]},
   {t:'Pourquoi bouger moins',sel:[{v:'I',l:'I'},{v:'IV',l:'IV (2e renv.)'},{v:'V',l:'V (1er renv.)'},{v:'I2',l:'I'}],h:`Pour enchaîner I – IV – V – I, il n'est pas nécessaire de faire sauter ta main. En choisissant un renversement du IV et un du V, chaque doigt ne bouge que d'un pas : la main reste en place, le résultat est plus fluide.`,kb:(k,s)=>hlList(KEYS[0],KBV(60,s==='I2'?'I':s)),demos:[{l:'Écouter I – IV – V – I sans sauter',run:()=>playSeqM([[48,60,64,67],[53,60,65,69],[55,59,62,67],[48,60,64,67]],1)},{l:'Écouter la version avec sauts',run:()=>playSeqM([[48,60,64,67],[53,65,69,72],[55,67,71,74],[48,60,64,67]],1)}],tip:`Compare les deux versions : c'est le même enchaînement, mais la première glisse, la seconde saute.`}],
   qs:[
    {q:`Qu'est-ce qu'un renversement ?`,o:[`Le même accord avec ses notes dans un autre ordre`,`Un accord joué à l'envers dans le temps`,`Un accord mineur`,`Un accord plus rapide`],w:`Les notes sont les mêmes ({C}, {E}, {G}), mais on commence par une autre : {E}–{G}–{C} est un renversement du {C} majeur.`},
    {q:`À quoi servent les renversements ?`,o:[`À enchaîner les accords en bougeant peu la main`,`À jouer plus fort`,`À changer de tonalité`,`À changer de rythme`],w:`Ils rapprochent les accords les uns des autres : tes doigts font des petits pas au lieu de grands sauts.`},
    {q:`{E}–{G}–{C} est…`,o:[`Le 1er renversement de {C} majeur`,`Le 2e renversement de {C} majeur`,`{E} mineur`,`{G} majeur`],w:`Le {E} (le 3 de l'accord) est à la basse : c'est le 1er renversement.`}]},
  {id:'3e',type:'kb',t:'Au clavier : la grille pop',intro:`Joue la grille la plus célèbre de la pop dans la tonalité de ton choix : I – V – vi – IV.`,steps:[`Choisis ta tonalité ({C} pour commencer).`,`Joue chaque accord avec trois doigts, deux temps chacun, en boucle : I – V – vi – IV.`,`Chante la note de basse de chaque accord, puis essaie de chanter une chanson que tu connais par-dessus.`],pick:true,sel:SELCH([1,5,6,4]),kb:(k,s)=>chordHL(k,s),demos:[dChords('Écouter la grille',[1,5,6,4],1.1)],hint:`Ralentis. Quand tu es à l'aise, change d'accord sans regarder tes mains.`},
  {id:'v2',type:'kb',t:'Au clavier : I – IV – V – I sans sauter',intro:`Enchaîne les trois accords principaux en bougeant le moins possible.`,steps:[`Pose ta main sur le I en position de base.`,`Passe au IV en 2e renversement (la note du bas reste en place), puis au V en 1er renversement, puis retour au I.`,`Essaie dans une autre tonalité avec les boutons.`],pick:true,sel:[{v:'I',l:'I'},{v:'IV',l:'IV (2e renv.)'},{v:'V',l:'V (1er renv.)'},{v:'I2',l:'I'}],kb:(k,s)=>hlList(k,KBV(tonic(k),s==='I2'?'I':s)),demos:[{l:'Écouter la version fluide',run:k=>{const b=tonic(k);playSeqM([[b-12,...KBV(b,'I').map(x=>x[0])],[b-7,...KBV(b,'IV').map(x=>x[0])],[b-5,...KBV(b,'V').map(x=>x[0])],[b-12,...KBV(b,'I').map(x=>x[0])]],1)}}],hint:`Entre le I et le IV, la note du bas ne bouge pas. Entre le IV et le V, deux doigts montent ou descendent d'un seul pas.`}
]},
 {id:'u4',title:'Retrouver une mélodie',goal:'Mélodie',col:'var(--d2)',desc:'Retrouver une suite de notes, comme un bout de chanson.',L:[
    {id:'e1',type:'learn',t:'Comment une mélodie bouge',pages:[
   {t:'Notes stables et instables',h:`Les notes <b>1, 3 et 5</b> sont <b>stables</b> : ce sont celles de l'accord de la maison, on peut s'y poser. Les notes <b>2, 4, 6 et 7</b> sont <b>instables</b> : elles veulent bouger vers une note stable voisine.`,kb:()=>scaleHL(KEYS[0]),demos:[dDegs('Les stables : 1 – 3 – 5',[1,3,5],.6),dDegs('Les instables : 2 – 4 – 6 – 7',[2,4,6,7],.6)]},
   {t:'La résolution',sel:[{v:[2,1],l:'2 → 1'},{v:[4,3],l:'4 → 3'},{v:[7,8],l:'7 → 1'},{v:[6,5],l:'6 → 5'}],h:`Une note instable se résout vers la note stable la plus proche : <b>2 → 1</b>, <b>4 → 3</b>, <b>6 → 5</b>, et le <b>7</b> monte vers le <b>1</b>. C'est ce qui donne l'impression qu'une mélodie avance ou se pose.`,kb:(k,s)=>degsHL(k,s),demos:[{l:'Écouter la résolution',run:(k,s)=>playSeqM(s.map(d=>degMidi(k,d)),.7)}]},
   {t:'Retrouver une mélodie',h:`Pour retrouver une mélodie à l'oreille : (1) repère la <b>note maison</b>, (2) suis la <b>direction</b> : ça monte ou ça descend, (3) compte les <b>petits pas</b>, (4) regarde la dernière note : stable, la phrase se pose ; instable, elle attend la suite.`,kb:()=>scaleHL(KEYS[0]),demos:[dDegs('Une phrase qui se pose (finit sur 1)',[3,4,3,2,1],.5),dDegs('Une phrase en suspens (finit sur 2)',[1,3,4,3,2],.5)]}],
   qs:[
    {q:`Quelles notes sont stables ?`,o:[`1, 3 et 5`,`2, 4 et 6`,`1, 4 et 7`,`3, 5 et 7`],w:`1, 3 et 5 forment l'accord de la maison : ce sont les notes stables. Les autres veulent bouger.`},
    {q:`Vers quelle note le 7 veut-il aller ?`,o:[`Le 1, au-dessus`,`Le 5`,`Le 3`,`Le 4`],w:`Le 7 est collé sous le 1 : il monte d'un demi-ton vers lui. On l'appelle la sensible.`},
    {q:`Une phrase qui finit sur le 2 donne l'impression…`,o:[`D'attendre la suite`,`De se poser`,`D'être terminée`,`D'être en mineur`],w:`Le 2 est instable : il veut redescendre vers le 1. La phrase reste donc en suspens.`},
    {q:`Quel est le premier réflexe pour retrouver une mélodie à l'oreille ?`,o:[`Repérer la note maison`,`Compter toutes les notes`,`Deviner la dernière note`,`Chercher les accords`],w:`Sans note maison, impossible de donner un degré aux autres notes. Elle sert de repère à tout le reste.`}]},
  {id:'4a',keys:'all',t:'3 notes, pas à pas',type:'mel',len:3,set:[1,2,3,4,5],step:true,intro:`Trois notes qui avancent par petits pas. La plupart des mélodies bougent ainsi.`,tip:`Repère la direction (ça monte, ça descend), puis compte les pas.`},
  {id:'4b',keys:'all',t:'3 notes, toute la gamme',type:'mel',len:3,set:[1,2,3,4,5,6,7],intro:`Les notes peuvent maintenant sauter plus loin.`,tip:`Sur un saut, cherche d'abord si la note est stable (1, 3, 5).`},
  {id:'4c',keys:'all',t:'4 notes',type:'mel',len:4,set:[1,2,3,4,5,6,7],step:true,intro:`Quatre notes : un vrai petit motif de chanson.`,tip:`Chante la mélodie dans ta tête avant de répondre.`},
  {id:'4d',keys:'all',t:'Une phrase de 5 notes',type:'mel',len:5,set:[1,2,3,4,5,6,7],intro:`Cinq notes, comme une phrase de chanson.`,tip:`Retrouve la première et la dernière note, puis remplis le milieu.`},
  {id:'4e',type:'kb',t:"Au clavier : le début d'une chanson",intro:`Premier essai pour jouer sans partition : retrouve le début d'une chanson que tu connais.`,steps:[`Choisis une chanson simple et très connue (une comptine fait l'affaire).`,`Chante-la dans ta tête et trouve sa note maison : celle sur laquelle elle se pose à la fin.`,`Cherche la première note à tâtons, puis la suivante : ça monte ou ça descend ? de combien de pas ?`,`Facultatif : vérifie les degrés sur TheoryTab.`],pick:true,kb:k=>degsHL(k,[1]),demos:[{l:'Jouer la note maison',run:k=>playSeqM([degMidi(k,1)],1)},{l:'Écouter la cadence',run:k=>{const t=newBus();cadence(k,t)}}],hint:`Commence par 3 ou 4 notes seulement. Si tu bloques, cherche d'abord la dernière note : c'est souvent le 1.`}]},
 {id:'u5',title:'Toutes les tonalités',goal:'Mélodie + accords',col:'var(--d6)',desc:'La maison change de place, les degrés restent les mêmes.',L:[
    {id:'f1',type:'learn',t:'Les tonalités principales',pages:[
   {t:'8 tonalités suffisent',pick:true,h:(k)=>`Pas besoin des 12 gammes : ces 8 tonalités couvrent presque toutes les chansons pop. Choisis-en une. Gamme de <b>${keyName(k)}</b> : ${k.notes.map(fmt).join(' – ')}. Touches noires utilisées : ${k.notes.filter(n=>n.length>1).length}.`,kb:k=>scaleHL(k),demos:[dScale()]},
   {t:'Le tableau à garder',h:()=>`Même formule, notes différentes :<br>${KEYS.map(k=>`<b>${keyName(k)}</b> : ${k.notes.map(fmt).join(' ')}`).join('<br>')}`,tip:`Commence par {C} (aucune touche noire), {G} et {F} (une seule). Les autres viendront avec la pratique.`},
   {t:'Choisir la tonalité de ta voix',pick:true,sel:SELCH([1,5,6,4]),h:`Pour chanter, la tonalité compte : trop haut, tu forces ; trop bas, tu perds ta voix. Essaie la même chanson dans plusieurs tonalités et garde celle où le plus aigu et le plus grave sont confortables. Tu changes seulement la note maison : les degrés et les accords (I, IV, V, vi) restent identiques.`,kb:(k,s)=>chordHL(k,s),demos:[dChords('Grille pop dans cette tonalité',[1,5,6,4],1.1)]}],
   qs:[
    {q:`Quelle gamme majeure n'a aucune touche noire ?`,o:[`{C}`,`{G}`,`{F}`,`{D}`],w:`La gamme de {C} : {C} {D} {E} {F} {G} {A} {B}, que des touches blanches.`},
    {q:`Pour adapter une chanson à ta voix, que change-t-on ?`,o:[`La note maison : les degrés restent`,`Les degrés`,`Le rythme`,`Rien : on chante plus fort`],w:`On décale la note maison. La mélodie en degrés et les accords en chiffres romains ne bougent pas.`},
    {q:`Combien de touches noires dans la gamme de {G} majeur ?`,o:[`1`,`0`,`2`,`3`],w:`{G} {A} {B} {C} {D} {E} {F#} : une seule touche noire, le {F#}.`},
    {q:`En {F} majeur, quelle note remplace le {B} naturel ?`,o:[`{Bb}`,`{B}`,`{F#}`,`{A}`],w:`Pour garder la formule, le degré 4 de {F} majeur est {Bb} : {F} {G} {A} {Bb} {C} {D} {E}.`}]},
  {id:'5a',t:'Sur deux octaves, ailleurs',type:'deg',set:[1,3,5],keys:'all',wide:true,intro:`Les notes peuvent maintenant sonner plus grave ou plus aigu. Un 3 reste un 3 : seule la hauteur change.`,tip:`Écoute bien la cadence : c'est elle qui te dit où est la maison.`},
  {id:'5b',t:'Toute la gamme, deux octaves',type:'deg',set:[1,2,3,4,5,6,7],keys:'all',wide:true,intro:`Toute la gamme, graves et aigus, dans toutes les tonalités. C'est l'étape la plus délicate : sois patient.`,tip:`Un jour, les autres tonalités sonneront comme Do. C'est le signe que ton oreille relative est là.`},
  {id:'5c',t:'Les accords, ailleurs',type:'chord',set:[1,4,5,6],keys:'all',intro:`I, IV, V et vi dans toutes les tonalités. C'est exactement ce qu'il faut pour accompagner une chanson dans ta voix.`,tip:`La basse reste ton meilleur indice.`},
  {id:'5d',t:'Les grilles, ailleurs',type:'prog',len:4,set:[1,4,5,6],keys:'all',intro:`Des grilles de 4 accords dans toutes les tonalités.`,tip:`Une grille en Sol ou en Do a la même couleur : fie-toi aux degrés.`},
  {id:'5e',t:'Les mélodies, ailleurs',type:'mel',len:4,set:[1,2,3,4,5,6,7],keys:'all',intro:`Des mélodies de 4 notes dans toutes les tonalités.`,tip:`Cherche la maison d'abord, puis les degrés.`},
  {id:'5f',type:'kb',t:'Au clavier : ta tonalité',intro:`Trouve la tonalité qui convient à ta voix et joue dedans.`,steps:[`Choisis une tonalité avec les boutons : la gamme s'allume.`,`Joue la note maison et chante-la. Trop grave ou trop aigu ? Essaie une autre tonalité.`,`Joue la grille pop (I – V – vi – IV) dans la tonalité retenue.`,`Refais avec une deuxième tonalité.`],pick:true,kb:k=>scaleHL(k),demos:[dScale(),dChords('Grille pop',[1,5,6,4],1.1)],hint:`Une bonne tonalité de chant : le passage le plus aigu de la chanson reste confortable, sans forcer.`}]},
 {id:'u6',title:'Oreille complète',goal:'Mélodie + accords',col:'var(--gold)',desc:"Le niveau des chansons pop réelles. Dernière étape avant l'objectif.",L:[
  {id:'6a',keys:'all',t:'Les accords ii et iii',type:'chord',set:[1,2,3,4,5,6],intro:`Deux nouveaux mineurs : le <b>ii</b> (qui prépare le V) et le <b>iii</b>, plus rare. C'est le chapitre 4 de Hooktheory.`,tip:`Trois accords sont mineurs maintenant : ii, iii et vi. Écoute la basse pour les départager.`},

/* ===================== PARCOURS ACCOMPAGNER (clavier MIDI) ===================== */
const pc=m=>((m%12)+12)%12;
const bassMidi=(k,d)=>{let b=chordMidis(k,d).bass;while(b<48)b+=12;while(b>59)b-=12;return b};
const triM=(k,d)=>chordMidis(k,d).tri;
const cNames=(k,d)=>d<=7?[fmt(k.notes[d-1]),fmt(k.notes[(d+1)%7]),fmt(k.notes[(d+3)%7])]:chordMidis(k,d).tri.map((m,i)=>i===0?fmt(B7[k.id]):fmt(NN[pc(m)]));
const evNote=(m,d,lab)=>({p:[pc(m)],hl:[{m,d}],lab});
const evChord=(ms,lab)=>({p:ms.map(pc),hl:ms.map((m,i)=>({m,d:[1,3,5][i]})),lab});
const midChordSteps=ds=>k=>ds.map(d=>({t:`${ROM[d-1]} : joue l'accord ${chordName(k,d)} (${cNames(k,d).join(' – ')}), les trois notes ensemble.`,ev:[evChord(triM(k,d),chordName(k,d))]}));
const midBassSteps=ds=>k=>ds.map(d=>{const nm=cNames(k,d);return {t:`${ROM[d-1]} (${chordName(k,d)}) : main gauche, la basse (${nm[0]}) ; puis main droite, l'accord (${nm.join(' – ')}).`,ev:[evNote(bassMidi(k,d),1,nm[0]),evChord(triM(k,d),chordName(k,d))]}});
const arpEv=(k,d,pat)=>{const t=triM(k,d),nm=cNames(k,d);nm[3]=nm[0];return pat.map(i=>evNote(i===3?t[0]+12:t[i],[1,3,5,1][i],nm[i]))};
const midArpSteps=(ds,pat,bpm)=>k=>ds.map(d=>{const ev=arpEv(k,d,pat);return {t:`${ROM[d-1]} (${chordName(k,d)}) : joue ${ev.map(e=>e.lab).join(' – ')}, une note à la fois, en boucle si tu veux.`,ev,timed:true,bpm}});
const midBFSteps=(ds,bpm)=>k=>ds.map(d=>{const nm=cNames(k,d),b=bassMidi(k,d);return {t:`${ROM[d-1]} (${chordName(k,d)}) : basse ${nm[0]}, accord, basse ${fmt(NN[pc(b+7)])} (la quinte), accord.`,ev:[evNote(b,1,nm[0]),evChord(triM(k,d),chordName(k,d)),evNote(b+7,5,fmt(NN[pc(b+7)])),evChord(triM(k,d),chordName(k,d))],timed:true,bpm}});
const midGridSteps=(ds,bpm)=>k=>[{t:`La grille ${ds.map(d=>ROM[d-1]).join(' – ')} en ${keyName(k)} : pour chaque accord, joue l'arpège 1 – 3 – 5 – 3 (une note par temps), puis passe à l'accord suivant sans t'arrêter.`,ev:ds.flatMap(d=>arpEv(k,d,[0,1,2,1])),timed:true,bpm}];
const U_A={id:'ua',title:'Accompagner',goal:'Accompagnement',col:'#38d9a9',desc:"Jouer des accords avec les deux mains : plaqués, avec la basse, en arpège. L'app écoute ton clavier MIDI et vérifie les notes.",L:[
 {id:'a1',type:'learn',t:'Les façons de jouer un accord',pages:[
  {t:'Trois façons',pick:true,h:k=>`Un accord a trois notes. Tu peux les jouer de trois façons : <b>plaquées</b> (les trois ensemble), en <b>arpège</b> (l'une après l'autre) ou <b>basse + accord</b> (une note grave, puis les trois). Ici : l'accord de ${keyName(k)}, <b>${chordName(k,1)}</b> (${cNames(k,1).join(' – ')}).`,kb:k=>chordHL(k,1),demos:[{l:'Plaqué',run:k=>playSeqM([chordMidis(k,1).tri],1.2)},{l:'Arpège',run:k=>playSeqM(chordMidis(k,1).tri,.45)},{l:'Basse + accord',run:k=>playSeqM([chordMidis(k,1).bass,chordMidis(k,1).tri],.7)}]},
  {t:'La main gauche, la basse',pick:true,h:`La <b>basse</b> est la note grave qui donne son nom à l'accord : c'est le <b>1 de l'accord</b> (la fondamentale). Tu la joues à la main gauche, une ou deux octaves plus bas. La main droite joue l'accord ou l'arpège. Quand l'accord change, la basse change aussi.`,kb:k=>({[bassMidi(k,1)]:{d:1,l:'1',n:fmt(k.notes[0])},...chordHL(k,1)}),demos:[{l:'Basses de I – V – vi – IV',run:k=>playSeqM([1,5,6,4].map(d=>bassMidi(k,d)),.7)},{l:'Avec les accords',run:k=>playSeqM([1,5,6,4].map(d=>[bassMidi(k,d),...chordMidis(k,d).tri]),1)}]},
  {t:'Les motifs de base',pick:true,h:`Voici les motifs que tu vas jouer : <b>1 – 3 – 5 – 3</b> (monte, puis redescend d'une note), <b>1 – 3 – 5 – 8 – 5 – 3</b> (monte jusqu'à l'octave puis redescend), <b>basse – accord – quinte – accord</b>. Le chiffre est la place dans l'accord : 1 = fondamentale, 3 = tierce (la note du milieu), 5 = quinte (la note du haut), 8 = la fondamentale une octave plus haut. Commence lentement, avec le métronome.`,kb:k=>chordHL(k,1),demos:[{l:'1 – 3 – 5 – 3',run:k=>{const t=chordMidis(k,1).tri;playSeqM([t[0],t[1],t[2],t[1]],.5)}},{l:'1 – 3 – 5 – 8 – 5 – 3',run:k=>{const t=chordMidis(k,1).tri;playSeqM([t[0],t[1],t[2],t[0]+12,t[2],t[1]],.4)}}],tip:`Un motif se répète à l'identique sur chaque accord : seule la position des doigts change.`}],
  qs:[
   {q:`Comment s'appelle la note grave qui donne son nom à l'accord ?`,o:[`La basse (la fondamentale)`,`La quinte`,`La tierce`,`L'octave`],w:`La fondamentale (le 1 de l'accord) donne son nom à l'accord. On la joue souvent en basse, à la main gauche.`},
   {q:`Dans « 1 – 3 – 5 – 3 », que représente le 5 ?`,o:[`La quinte : la note du haut de l'accord`,`La cinquième note de la gamme`,`Le cinquième temps`,`Une note de la basse`],w:`Ces chiffres désignent la place dans l'accord : 1 fondamentale, 3 tierce, 5 quinte.`},
   {q:`Qu'est-ce qu'un arpège ?`,o:[`Les notes de l'accord jouées l'une après l'autre`,`Les trois notes jouées ensemble`,`Une basse seule`,`Un accord mineur`],w:`Arpège = les notes de l'accord en séquence. Plaqué = toutes ensemble.`},
   {q:`Quand l'accord change dans la grille, que fait le motif ?`,o:[`Il reste le même, sur le nouvel accord`,`Il change complètement`,`Il disparaît`,`Il devient plus rapide`],w:`Le motif se répète à l'identique : seul l'accord change, donc les notes aussi.`}]},
 {id:'a2',type:'mid',t:'Plaquer les accords',intro:`Joue chaque accord en plaquant ses trois notes ensemble. L'app vérifie les notes jouées (la hauteur n'a pas d'importance : une octave plus haut ou plus bas est bon). Les touches colorées te montrent où jouer.`,hint:`La note du bas est la fondamentale (celle qui donne son nom à l'accord). Les deux autres sont une touche sur deux au-dessus.`,build:midChordSteps([1,4,5,6])},
 {id:'a3',type:'mid',t:'Basse + accord',intro:`La base de l'accompagnement : une note grave à la main gauche, puis l'accord à la main droite. Joue la basse, puis les trois notes de l'accord.`,hint:`La basse est la même note que le bas de l'accord. Joue-la à la main gauche, une octave plus bas si tu veux.`,build:midBassSteps([1,4,5,6])},
 {id:'a4',type:'mid',t:'Arpège 1 – 3 – 5 – 3',intro:`Les notes de l'accord l'une après l'autre : fondamentale, tierce, quinte, tierce. Appuie sur « Avec métronome » : 4 clics, puis joue une note par clic. L'app mesure ta régularité (sans bloquer la leçon).`,hint:`Joue lentement. Une régularité imparfaite n'empêche pas de réussir : c'est l'ordre des notes qui compte ici.`,build:midArpSteps([1,4,5,6],[0,1,2,1],66)},
 {id:'a5',type:'mid',t:'Arpège montant et descendant',intro:`Un arpège plus long : fondamentale, tierce, quinte, octave, quinte, tierce. Il revient à la fondamentale quand on le répète.`,hint:`L'octave est la fondamentale, une octave plus haut : cherche la même note juste au-dessus de la quinte.`,build:midArpSteps([1,4,5],[0,1,2,3,2,1],66)},
 {id:'a6',type:'mid',t:'Basse – accord – quinte – accord',intro:`Un motif classique de folk et de country : la basse, l'accord, la quinte de la basse (à une quinte au-dessus), puis l'accord de nouveau.`,hint:`La quinte de la basse est la 5e note à partir de la basse : c'est la même que la note du haut de l'accord.`,build:midBFSteps([1,4,5],66)},
 {id:'a7',type:'mid',t:'Une grille, en arpège',intro:`La vraie situation : une grille de 4 accords, jouée en arpège. 16 notes, un accord après l'autre. Prends le temps de lire la grille avant de commencer.`,hint:`Pense à l'accord avant de jouer : un accord = 4 notes d'arpège, puis tu passes au suivant.`,build:midGridSteps([1,5,6,4],66)},
 {id:'a8',type:'kb',t:`Au clavier : t'accompagner en chantant`,intro:`Le but final : chanter une chanson que tu connais en jouant sa grille.`,steps:[`Choisis une chanson avec 3 ou 4 accords (le défi de la semaine, ou une chanson que tu aimes).`,`Joue la grille en boucle avec un motif que tu maîtrises (arpège ou basse + accord).`,`Chante par-dessus. Si tu perds la grille, ralentis : il vaut mieux lent et continu que rapide et haché.`],pick:true,sel:SELCH([1,5,6,4]),kb:(k,s)=>chordHL(k,s),demos:[{l:'Écouter la grille en arpège',run:k=>playSeqM([1,5,6,4].flatMap(d=>{const t=chordMidis(k,d).tri;return [t[0],t[1],t[2],t[1]]}),.38)}],hint:`Si ça coince, joue seulement la basse à chaque accord en chantant, puis ajoute l'accord.`}]};

const degEv=(k,d)=>evNote(degMidi(k,d),d,String(d));
const melStep=(k,ds,t)=>{const tn=degMidi(k,1);return {t:`${t} Les degrés : ${ds.join(' – ')}.`,mem:`Écoute (tu entends d'abord la maison, le 1, puis la mélodie), puis rejoue la mélodie sur ton clavier.`,listen:true,cue:[tn,...ds.map(d=>degMidi(k,d))],cueGap:.55,ev:ds.map(d=>degEv(k,d))}};
const H1={id:'h1',type:'mid',opt:true,t:'À l\'oreille : rejouer une mélodie',intro:`Tu entends la maison (le 1), puis une courte mélodie. Rejoue-la sur ton clavier, sans que les touches soient affichées : c'est ton oreille qui guide tes doigts. Tu peux réécouter autant que tu veux. Ce défi ne bloque pas la suite.`,hint:`Chante la mélodie dans ta tête en partant du 1. Si tu bloques, « Montrer l'aide » affiche les touches.`,
 build:k=>[[1,2,3],[3,2,1],[1,3,5],[1,2,3,2,1],[5,4,3,2,1]].map((ds,i)=>melStep(k,ds,`Mélodie ${i+1}.`))};
const gridStep=(k,ds,t)=>({t:`${t} La grille : ${ds.map(d=>ROM[d-1]).join(' – ')} (${ds.map(d=>chordName(k,d)).join(' – ')}).`,mem:`Écoute (d'abord la maison, le I, puis 4 accords) et joue les 4 accords, plaqués, dans l'ordre.`,listen:true,cue:[chordMidis(k,1).tri,...ds.map(d=>chordMidis(k,d).tri)],cueGap:1,ev:ds.map(d=>evChord(triM(k,d),chordName(k,d)))});
const H2={id:'h2',type:'mid',opt:true,t:'À l\'oreille : retrouver une grille',intro:`Tu entends d'abord le I (la maison), puis une grille de 4 accords. Retrouve-les à l'oreille et joue-les, plaqués. C'est le lien direct entre l'oreille et l'accompagnement : tu repères les accords, tu les joues. Ce défi ne bloque pas la suite.`,hint:`Cherche d'abord si le premier accord est la maison (I) ou un accord triste (vi). « Montrer l'aide » affiche les touches si tu bloques.`,
 build:k=>[[1,5,6,4],[1,6,4,5],[1,4,5,1],[6,4,1,5]].map((ds,i)=>gridStep(k,ds,`Grille ${i+1}.`))};

/* ===================== ACCOMPAGNER : ALLER PLUS LOIN ===================== */
const romK=(k,d)=>(k.m?ROMM:ROM)[d-1];
const INVL=['position fondamentale','1er renversement','2e renversement'];
const invCands=(k,d)=>{const t=chordMidis(k,d).tri,c=[];for(let inv=0;inv<3;inv++){const n=[t[0],t[1],t[2]].map((m,i)=>i<inv?m+12:m).sort((a,b)=>a-b);for(const o of [-12,0,12]){const v=n.map(m=>m+o);if(v[0]>=52&&v[2]<=72)c.push({v,inv})}}return c};
const voiceChain=(k,ds)=>{const out=[];let prev=null;ds.forEach(d=>{const c=invCands(k,d);let best;
 if(!prev)best=c.filter(x=>x.inv===0).sort((a,b)=>Math.abs(a.v[1]-62)-Math.abs(b.v[1]-62))[0]||c[0];
 else best=c.map(x=>({x,s:x.v.reduce((a,m,j)=>a+Math.abs(m-prev[j]),0)})).sort((a,b)=>a.s-b.s)[0].x;
 out.push(best);prev=best.v});return out};
const roleOf=(k,d,m)=>{const t=chordMidis(k,d).tri.map(pc);return [1,3,5][t.indexOf(pc(m))]};
const invHL=(k,d,inv)=>{const x=invCands(k,d).find(y=>y.inv===inv),h={};const nm=cNames(k,d);x.v.forEach(m=>{const r=roleOf(k,d,m);h[m]={d:r,l:r,n:nm[[1,3,5].indexOf(r)]}});return h};
const invEv=(k,d,x)=>{const nm=cNames(k,d),roles=x.v.map(m=>roleOf(k,d,m));return {p:x.v.map(pc),low:pc(x.v[0]),lowName:nm[[1,3,5].indexOf(roles[0])],hl:x.v.map((m,i)=>({m,d:roles[i]})),lab:chordName(k,d)}};
const scaleSteps=(k,up)=>{const ds=[1,2,3,4,5,6,7,8],o=up?ds:ds.slice().reverse();return o.map(d=>evNote(degMidi(k,d),d>7?1:d,fmt(k.notes[(d-1)%7])))};
const G1={id:'g1',type:'mid',t:'Gamme majeure au clavier',intro:`Joue la gamme majeure en montant puis en descendant, dans la tonalité de ton choix. Les touches à jouer s'allument une par une. Pour les doigtés, regarde le cours « Modes majeurs » de Flowkey. Ici, l'objectif est que ta main connaisse la forme de la gamme dans chaque tonalité.`,hint:`Une gamme majeure suit toujours la même formule : ton, ton, demi-ton, ton, ton, ton, demi-ton. Joue lentement, avec le métronome si tu veux.`,
 build:k=>[{t:`${keyName(k)} en montant : ${k.notes.map(fmt).join(' – ')} – ${fmt(k.notes[0])}.`,ev:scaleSteps(k,true),timed:true,bpm:60},{t:`${keyName(k)} en descendant : retour à ${fmt(k.notes[0])}.`,ev:scaleSteps(k,false),timed:true,bpm:60}]};
const A9={id:'a9',type:'learn',t:'Les renversements',pages:[
 {t:'Le problème : les sauts',pick:true,h:k=>`Si tu joues chaque accord avec la fondamentale en bas, ta main saute d'un accord à l'autre : ${chordName(k,1)}, puis ${chordName(k,4)}, puis ${chordName(k,5)}. C'est lent et ça sonne haché. Écoute la différence entre sauter et rester en place.`,kb:k=>chordHL(k,1),demos:[{l:'Accords qui sautent',run:k=>playSeqM([1,4,5,1].map(d=>chordMidis(k,d).tri),.9)},{l:'Accords sur place',run:k=>playSeqM(voiceChain(k,[1,4,5,1]).map(x=>x.v),.9)}]},
 {t:'Le renversement',pick:true,sel:[{v:0,l:'Fondamentale'},{v:1,l:'1er renversement'},{v:2,l:'2e renversement'}],h:(k,s)=>`Un <b>renversement</b>, c'est le même accord avec une autre note en bas. Ici ${chordName(k,1)} : <b>${INVL[s]}</b>. Les trois notes sont les mêmes, seul l'ordre change. Fondamentale en bas : position fondamentale. Tierce en bas : 1er renversement. Quinte en bas : 2e renversement.`,kb:(k,s)=>invHL(k,1,s),demos:[{l:'Écouter',run:(k,s)=>{const x=invCands(k,1).find(y=>y.inv===s);playSeqM([x.v],1.4)}}]},
 {t:'La règle : bouger le moins possible',pick:true,h:k=>`Quand l'accord change, joue le renversement le plus proche de l'accord précédent : une ou deux notes bougent, les autres restent. Ici : ${chordName(k,1)} puis ${chordName(k,4)}.`,kb:k=>{const vc=voiceChain(k,[1,4]);return invHL(k,4,vc[1].inv)},demos:[{l:'I puis IV, sur place',run:k=>playSeqM(voiceChain(k,[1,4]).map(x=>x.v),1)}],tip:`La main reste au même endroit du clavier : tu peux alors regarder ailleurs, chanter, ou jouer la basse de l'autre main.`}],
 qs:[
